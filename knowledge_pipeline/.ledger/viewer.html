<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge pipeline ledger</title>
<style>
/* Read only. Asks ./data every 30 s, redraws when the answer changed. Story first (where we are, what is next, what needs you),
   then drill: Map (stage > domain > capability), Work (board), Quality (rules and defects). Details open in a side sheet. */
:root{--bg:#0b0d10;--panel:#12151a;--raised:#1a1e25;--line:#252a33;--hair:#1b1f26;--t1:#eef1f5;--t2:#a3abb7;--t3:#6f7886;
  --accent:#5ad1c4;--good:#3fcf8e;--live:#4c9bff;--warn:#f2b441;--stop:#ff6b6b;--quiet:#586170;--ready:#dfe5ee;--r:12px;--shadow:0 12px 40px rgba(0,0,0,.45)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f7;--panel:#fff;--raised:#eef0f4;--line:#dfe3e9;--hair:#e9ecf0;--t1:#12161d;--t2:#4b5462;--t3:#78818e;
  --accent:#0c8d81;--good:#15885a;--live:#1c6bdc;--warn:#a96a00;--stop:#cf3b3b;--quiet:#98a1ad;--ready:#27303c;--shadow:0 12px 40px rgba(18,22,29,.14)}}
:root[data-theme="light"]{--bg:#f3f4f7;--panel:#fff;--raised:#eef0f4;--line:#dfe3e9;--hair:#e9ecf0;--t1:#12161d;--t2:#4b5462;--t3:#78818e;
  --accent:#0c8d81;--good:#15885a;--live:#1c6bdc;--warn:#a96a00;--stop:#cf3b3b;--quiet:#98a1ad;--ready:#27303c;--shadow:0 12px 40px rgba(18,22,29,.14)}
.erow{display:grid;grid-template-columns:minmax(120px,.8fr) 104px 210px repeat(3,minmax(0,1.1fr));gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--hair)}.erow:last-child{border-bottom:0}.erd summary{list-style:none;cursor:pointer}.erd summary::-webkit-details-marker{display:none}.erd[open]>summary{background:var(--hair)}.ec{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}.ehd .ec{font-size:11px}.edet{padding:6px 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 18px;font-size:12px;color:var(--t2)}.etab{container-type:inline-size}.etx{font-size:13px;line-height:1.4;text-wrap:pretty;overflow-wrap:normal;word-break:normal;hyphens:none}.etx::before{display:none}@container (max-width:900px){.erow{grid-template-columns:1fr auto;gap:6px 12px}.erow.ehd{display:none}.erow>.enow,.erow>.etx{grid-column:1/-1}.etx::before{display:block;content:attr(data-l);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}.qtab{grid-template-columns:1fr 1fr 1fr!important}.ftt,.vtab{grid-template-columns:1fr!important}.ftt.ehd,.vtab.ehd{display:none}.ftt>span::before,.vtab>span::before{content:attr(data-l)": ";font-size:10px;color:var(--t3)}.qtab.ehd{display:none}.qtab .qc::before{content:attr(data-l)" ";font-size:10px;color:var(--t3)}}.ftab{display:grid;gap:8px 10px;align-items:center;font-size:13px;padding:8px 0}.ftab.ehd{font-size:11px}.qtab{display:grid;grid-template-columns:minmax(110px,1fr) 88px repeat(5,minmax(72px,.8fr));gap:8px 10px;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--hair)}.qtab:last-child{border-bottom:0}.qtab.ehd{font-size:11px}.fbwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px 40px;align-items:start}.fbh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0 4px}.fbg{display:grid;grid-template-columns:48px minmax(118px,max-content) minmax(0,1fr) auto;gap:5px 12px;font-size:13px;align-items:baseline;padding:2px 0}.fbg .num{font-variant-numeric:tabular-nums}.fsrc{font-size:10px;padding:0 7px;border:1px solid var(--hair);border-radius:9px;color:var(--t3);white-space:nowrap}.fbc{padding:6px 0 2px}.fbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);padding-bottom:3px}.fbr{display:grid;grid-template-columns:84px minmax(60px,1fr) 38px 64px;gap:10px;align-items:center;font-size:12px;padding:1px 0}.fbt{height:7px;background:var(--hair);border-radius:4px;overflow:hidden}.fbt i{display:block;height:100%}.fbt i.g{background:var(--good)}.fbt i.w{background:var(--warn)}.fbt i.b{background:var(--stop)}.fbw{padding-top:8px;font-size:13px}
.qc{white-space:nowrap;font-variant-numeric:tabular-nums}.ftt,.vtab{display:grid;gap:8px 12px;align-items:start;font-size:13px;padding:9px 0;border-bottom:1px solid var(--hair)}.ftt{grid-template-columns:minmax(110px,.8fr) repeat(4,minmax(0,1.2fr))}.vtab{grid-template-columns:minmax(120px,.9fr) repeat(4,minmax(0,1.2fr))}.ftt:last-child,.vtab:last-child{border-bottom:0}.ftt.ehd,.vtab.ehd{font-size:11px}.qq{display:grid;grid-template-columns:130px minmax(0,1fr);gap:2px 12px;font-size:13px;padding:6px 0}.efit{font-size:11px;color:var(--t2);margin-top:4px}.enow .mt{font-size:13px}.tt{border-bottom:1px dotted var(--t3);cursor:help}.erow .big{font-size:22px;font-weight:650}.elh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.evb{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap}.trow{display:grid;grid-template-columns:1.6fr 150px 130px;gap:14px;padding:10px 0;border-bottom:1px solid var(--hair)}.trow:last-child{border-bottom:0}@media(max-width:760px){.erow,.trow{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 12px}.tile .big{font-size:28px;font-weight:700;line-height:1.1}.tile .tl{font-weight:600;margin-top:2px}.cta{border-left:4px solid var(--warn);margin:0 0 12px}.ehd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);padding:8px 0}.det summary{cursor:pointer;color:var(--t2);font-size:12px}.trow{align-items:start}.trow>.det{grid-column:1/-1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100vh;overflow:hidden}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 10px;gap:2px}
.brand{padding:2px 10px 18px;font-weight:650;letter-spacing:-.01em;font-size:15px}
.brand small{display:block;color:var(--t3);font-weight:450;font-size:12px;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--t2);font-weight:500}
.nav:hover{background:var(--raised)}.nav.on{background:var(--raised);color:var(--t1)}
.nav svg{width:16px;height:16px;flex:none}
.nav .b{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--t2)}
.nav .b.hot{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.rail .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--hair);color:var(--t3);font-size:12px;display:grid;gap:6px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;animation:p 2.4s infinite}
.pulse.off{background:var(--quiet);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{padding:22px 32px 6px}
.top h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--t2);max-width:70ch}
.top .link{color:var(--accent);margin-left:6px}
.view{flex:1;overflow-y:auto;padding:18px 32px 64px}
.sec{margin-top:22px}
.sec>h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);display:flex;gap:10px;align-items:center}
.sec>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:450}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--raised);color:var(--t2);white-space:nowrap}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.t-good{--c:var(--good)}.t-live{--c:var(--live)}.t-warn{--c:var(--warn)}.t-stop{--c:var(--stop)}.t-ready{--c:var(--ready)}.t-quiet{--c:var(--quiet)}.t-drop{--c:var(--quiet)}
.muted{color:var(--t3)}.sub{color:var(--t2)}
.empty{color:var(--t3);padding:6px 0}
/* lifecycle strip */
.life{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;padding:14px 0 4px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px;display:flex;flex-direction:column;gap:7px;position:relative;min-width:0}
.stage:hover{border-color:var(--t3)}
.stage.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage .n{font-weight:600}.stage .q{color:var(--t3);font-size:12px;min-height:34px}
.seg{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--hair);gap:1px}
.seg i{display:block;height:100%}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--t2)}
.here-tag{position:absolute;top:-9px;left:12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#04201d;font-weight:700;padding:1px 7px;border-radius:99px}
/* cards */
.big{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--hair);width:100%;text-align:left}.item>span:last-child{min-width:0;flex:1}.ti,.mt,.sub{overflow-wrap:anywhere}
.item:first-of-type{border-top:0}
.item:hover .ti{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.ti{font-weight:500}.mt{color:var(--t3);font-size:12px}
.id{font-variant-numeric:tabular-nums;color:var(--t3);font-size:12px;min-width:34px}
/* live runs */
.lr{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,2fr) auto;gap:6px 14px;align-items:baseline;padding:8px 0;border-top:1px solid var(--hair);width:100%;text-align:left}
.rt{display:grid;width:100%}.rt .tr{display:grid;gap:0 12px;padding:5px 0;border-top:1px solid var(--hair);align-items:center;font-size:12.5px}
.rt .th{border-top:0;padding:0 0 5px;color:var(--t3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.rt .tr.row[data-go]{cursor:pointer}.rt .tr.row[data-go]:hover{background:var(--hair)}
.rt .c,.rt .th span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.rt .c.st{font-weight:500}.rt .tr.stale .c.st{color:var(--stop);font-weight:600}.rt .me{color:var(--stop);font-weight:600}
.rt .c:first-child{color:var(--t2)}
@media(max-width:760px){.rt .th{display:none}.rt .tr{grid-template-columns:1fr!important;gap:1px;padding:8px 0}.rt .c{white-space:normal}.rt .c:empty{display:none}.rt .c[data-l]:not(:empty)::before{content:attr(data-l)': ';color:var(--t3);font-size:11px}}
.lr:first-child{border-top:0}.lr .wh{font:600 11px ui-monospace,monospace;color:var(--t2)}.lr .jb{font-weight:500;overflow-wrap:anywhere}
.lr .ls{color:var(--t2);font-size:12px;overflow-wrap:anywhere}.lr .ag{color:var(--t3);font-size:12px;white-space:nowrap}.lr.stale .ag{color:var(--stop);font-weight:600}
.gl{display:inline-block;width:1.3em;color:var(--c);font-weight:700}.gl.on{animation:p 2.4s infinite}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}.sec-row h2{margin:0}
.dayh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:12px 0 2px}.dayh:first-child{padding-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chips .tag{border:0;cursor:pointer}.tag.on{background:var(--accent);color:#04201d;font-weight:600}
/* phases */
.phases{display:flex;flex-wrap:wrap;gap:8px}
.ph{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:96px}
.ph b{font-size:12px}.ph .mt{max-width:170px;white-space:normal}
.ph.on{border-color:var(--accent)}
/* map */
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--t2);font-size:12px;margin:2px 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mapst{margin-top:12px}
.mapst>button.hd{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.mapst .chev{width:14px;color:var(--t3);transition:transform .15s}.mapst.closed .chev{transform:rotate(-90deg)}
.mapst .body{margin:6px 0 0 14px;border-left:1px solid var(--line);padding-left:14px}
.mapst.closed .body{display:none}
.dom{margin:10px 0 4px;font-size:12px;color:var(--t3);font-weight:600}
.cap{display:grid;grid-template-columns:minmax(160px,1.2fr) auto minmax(90px,1fr) 56px;gap:12px;align-items:center;padding:7px 10px;border-radius:9px;width:100%}
.cap:hover{background:var(--raised)}
.cap .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.sq{display:flex;gap:3px;flex-wrap:wrap;min-width:20px}
.sq i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--c) 85%,transparent);display:block}
.sq i.none{background:var(--hair);outline:1px dashed var(--line);outline-offset:-1px}
.heatbar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
.heatbar i{display:block;height:100%;background:var(--good)}
/* work */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--t2);font-size:12px;background:var(--panel)}
.chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;align-items:start}
.col>h3{margin:0 0 8px;font-size:12px;color:var(--t2);font-weight:600;display:flex;gap:8px;align-items:center}
.col>h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col>h3 span{margin-left:auto;color:var(--t3)}
.tc{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.tc:hover{border-color:var(--t3);border-left-color:var(--c)}
.tc .ti{overflow-wrap:anywhere}
.tc .ft{display:flex;gap:8px;align-items:center;margin-top:7px}
.tc .heatbar{flex:1;height:5px}
/* quality */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .l{color:var(--t3);font-size:12px;margin-top:4px}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 40px;gap:12px;align-items:center;width:100%;padding:3px 0}
.brow:hover .nm{color:var(--accent)}
.brow .bar{height:10px;border-radius:99px;background:var(--hair);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--warn);border-radius:99px}
.brow .bar i.rdy{background:var(--accent)}
.mx{display:grid;grid-template-columns:auto repeat(4,56px);gap:6px;align-items:center;font-size:12px;color:var(--t3)}
.mx b{display:grid;place-items:center;height:44px;border-radius:8px;font-weight:600;color:var(--t1);background:color-mix(in srgb,var(--stop) calc(var(--k)*100%),var(--hair))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* quality gates */
.gh,.gr{display:grid;grid-template-columns:minmax(110px,.9fr) minmax(90px,1.4fr) minmax(90px,1.4fr) minmax(80px,1fr) 80px;gap:14px;align-items:center;padding:9px 12px}
.gh{color:var(--t3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-bottom:4px}
.gr{border-top:1px solid var(--hair)}.gr .nm{font-weight:550}
.gcol{display:flex;gap:6px;flex-wrap:wrap}
.gq{width:20px;height:20px;border-radius:6px;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--bg)}
.gq:hover{transform:scale(1.15)}
.gq.none{background:transparent;border:1.5px dashed var(--quiet)}
.gq.rx{outline:2px solid var(--stop);outline-offset:2px}
.gq.prov{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.28) 3px 5px)}
.fun{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr) 70px;gap:12px;align-items:center}
.fr .bar{height:10px;border-radius:99px;background:var(--hair);overflow:hidden}.fr .bar i{display:block;height:100%;background:var(--good)}
.lg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--t2);font-size:12px;margin:2px 0 12px}
.lg span{display:inline-flex;gap:6px;align-items:center}
/* sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;padding:20px 22px 48px;z-index:6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:5}
.sheet h2{margin:10px 0 6px;font-size:19px;letter-spacing:-.01em}
.sheet .k{margin:18px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);font-weight:600}
.sheet p{margin:0 0 6px;color:var(--t2)}
.sheet .x{float:right;color:var(--t2);padding:4px 10px;border-radius:8px;background:var(--raised)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;color:var(--t3);font-size:12px}
.crumb button{color:var(--t2)}.crumb button:hover{color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:9px;align-items:flex-start}
.steps .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--quiet);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px}
.steps .ck.d{background:var(--good);border-color:var(--good);color:#04180e}
.tl{list-style:none;margin:0;padding:0 0 0 12px;border-left:1px solid var(--line);display:grid;gap:10px}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-16px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--quiet))}
.ev{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--t2);word-break:break-all}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .brand,.rail .foot{display:none}.nav span:not(.b){font-size:12px}.nav{flex-direction:column;gap:2px;padding:6px 10px}.nav .b{display:none}
  .gh,.gr{grid-template-columns:90px 1fr 1fr}.gh span:nth-child(n+4),.gr>:nth-child(n+4){display:none}
  .top,.view{padding-left:16px;padding-right:16px}.cap{grid-template-columns:1fr auto}.cap .heatbar,.cap .rt{display:none}.board{grid-template-columns:repeat(5,230px)}}
</style>
</head>
<body>
<div class="app" id="app">
