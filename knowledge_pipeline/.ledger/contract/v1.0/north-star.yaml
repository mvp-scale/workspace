# The north star, in the owner's words as I understood them (paraphrase: the owner edits it before release).
name: Knowledge pipeline
statement: "Turn any stream of short content into small, fast CPU models that answer many questions about it in one pass, with no API call and no GPU when they run."
promise: "Every model ships with its measured accuracy against what people agree on, its speed, and the evidence behind both."
measure: "Questions answered per item in under 50 ms on one CPU thread, and each output cleared against a gate set from agreement."
positioning: "Not a general text classifier and not an LLM wrapper. A factory that makes small trusted models, starting with news items and reaching email, messages and other short content through adapters."
