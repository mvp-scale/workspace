  const cons = row.values.reduce((a, v, j) => ["spend", "buy_new", "subscribe", "travel"].includes(cols[j].id) ? a + v : a, 0), lead = leadOrder(row, cols)[0];

}
const cval = (r) => isEvent() ? r.values[S.col] : r.total - rowOf("WORLD:world").total;
const scaleMax = () => Math.max(isEvent() ? 1 : 5, ...S.res.read.rows.filter(x => x.level === "country" || x.level === "region").map(x => Math.abs(cval(x))));
