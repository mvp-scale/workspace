<style>
  /* Layout the shared CSS lacks. Colours come from shared tokens only (detector colours are --s1 to --s8; icons tell detectors apart beyond that). */

  .pn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pn > header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 12px 0; min-height: 26px; position: relative; }
  .pn > header .r { margin-left: auto; font-size: 12px; color: var(--text-3); }

  /* Detectors and people */

  .dchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); position: relative; }

  .dchip.quiet .nm { color: var(--text-2); font-weight: 500; } .dchip.quiet .ic { opacity: .75; }

  .bub { max-width: min(88%, 680px); padding: 4px 10px 6px; border-radius: 12px 12px 12px 4px; background: color-mix(in srgb, var(--v) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--v) 30%, var(--border)); font-size: clamp(14px, 0.4vw + 11px, 17px); line-height: 1.55; }

  .ph { box-shadow: inset 0 -2px 0 var(--c); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .readnote { font-size: 11px; color: var(--text-3); padding: 0 12px 6px; }

  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; flex: 1 1 0; min-height: 210px; }
  .stackroot { position: relative; overflow: hidden; }

  .moment.cool { background: var(--surface-2); border-color: var(--border); border-left-color: var(--c); }
  .moment .ic { color: var(--c); display: grid; place-items: center; flex: none; }

  .ck button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; }

  /* Tabbed card */

  .est { font: 500 11px var(--mono); color: var(--text-2); }
  .li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; } .li .ts { font: 500 11px var(--mono); color: var(--text-3); }
  .li .q { color: var(--text-2); overflow-wrap: anywhere; } .li .ic { display: inline-block; vertical-align: -2px; margin-right: 4px; color: var(--c); }
  .dform { display: grid; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }

  .icons button { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 5px; padding: 3px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
  .icons button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chartwrap { position: relative; flex: 1; min-height: 0; padding: 2px 10px 6px; } .chartwrap canvas { position: absolute; inset: 2px 10px 6px; width: calc(100% - 20px); height: calc(100% - 8px); }
  .key { font-size: 12px; color: var(--text-2); }
  .tabsbar { display: none; }
  @media (max-width: 1100px) {
    .cp { min-height: 0; }
    .cp .ctl { margin-left: 0; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "x"; }
    .stage > [data-pane] { grid-area: x; display: none; }
    .stage[data-tab="talk"] > [data-pane="talk"], .stage[data-tab="signals"] > [data-pane="signals"], .stage[data-tab="cues"] > [data-pane="cues"], .stage[data-tab="history"] > [data-pane="history"] { display: flex; flex-direction: column; }
    .stage[data-tab="signals"] > [data-pane="signals"] { display: grid; align-content: start; overflow: auto; }
    .stage[data-tab="cues"] > [data-pane="cues"] { overflow: auto; }

    .tabsbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: var(--surface); }
    .tabsbar button { border: 0; background: transparent; padding: 10px 4px; font: inherit; font-size: 12px; color: var(--text-3); border-top: 2px solid transparent; cursor: pointer; }
    .tabsbar button[aria-selected=true] { color: var(--text); border-top-color: var(--text); font-weight: 600; }
  }
  @media (max-width: 560px) { .trow { grid-template-columns: 1fr; } .bub { max-width: 92%; } .cp .top .sub { display: none; } }

  /* Tab panes: one job each */

  .fl .ts, .evx .ts { font: 500 11px var(--mono); color: var(--text-3); padding-top: 1px; }
  .fl .fh { display: flex; align-items: center; gap: 7px; font-size: 12.5px; } .fl .ic { color: var(--c); display: grid; place-items: center; }
  .fl .vc, .fl .cnt { font: 600 10.5px var(--mono); color: var(--text-2); } .fl .vc { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 0 6px; } .fl .pc { font: 600 11px var(--mono); margin-left: auto; } .fl .ts { font: 500 10.5px var(--mono); color: var(--text-3); }
  .fl .q { color: var(--text-2); font-size: 12.5px; overflow-wrap: anywhere; }

  .libchip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; padding: 4px 9px; border: 1px dashed var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text-2); cursor: pointer; } .libchip:hover { border-style: solid; color: var(--text); background: var(--surface-2); }

  };

  /* Nine validated question sets, eleven detectors. `scope` says what text the detector was validated on: one person's words, or a whole dialogue. */

    { id: "fear", icon: "alert", name: "Fear", q: "fear", read: "noul", scope: "person", about: "Does the text express fear or nervousness?" },
    { id: "politeness", icon: "heart", name: "Politeness", q: "politeness", read: "noul", scope: "person", about: "Is the speaker polite and deferential to the person addressed?" },

    { key: "k_uncertain", name: "Uncertainty", icon: "eye", what: "the speaker expresses uncertainty, hedges, or says they are not sure" },
    { key: "k_empathy", name: "Empathy", icon: "users", what: "the speaker acknowledges or shows understanding of another person's feelings" },
    { key: "k_deflect", name: "Deflection", icon: "target", what: "the speaker avoids answering, changes the subject, or deflects responsibility" },
  ];

  const QALL = {}, C = new Map(), CPS = [], FLAGS = [], LAGS = [], QUEUE = [], SPOKE = [], PC = {}, rows = {}, ROWSPK = {};

  const VOICES = {};
  const N = { returns: 0, calls: 0, dropped: 0, capHit: false, failed: 0, checksMade: 0, tokens: 0, applied: 0, maxQueue: 0, e2e: [], wall: [], testChecks: 0 };
  const V = { ws: null, stab: null, running: false, state: "idle", msg: "", audioS: 0, snapWall: 0, wall0: 0, snaps: 0, words: 0, lastSnap: null, ingest: null, mic: null, stepMs: 0, hopMs: 0, lagSamples: [] };

  const numOf = (spk) => spk === "_call" ? 0 : (parseInt(String(spk).split("_")[1], 10) || 0) + 1;

  const newState = () => ({ latest: 0, marks: [], disp: 0, lastFire: -1e9, n: 0 });

  const stFor = (d, spk) => cs(d, d.scope === "call" ? "_call" : spk);
  function newDet(o) { return { key: o.key, pid: o.pid || null, label: o.label, icon: o.icon, slot: o.slot, scope: o.scope || "person", q: o.q, read: o.read || "noul", custom: !!o.custom, about: o.about || "", example: o.example || "", st: {}, agg: { disp: 0, who: null, n: 0 }, addedAt: V.audioS }; }
  function addLibrary(pid) {

  }
  const customQ = (what, example) => ({ type: "noul", instructions: `Does the text match this description: ${what}`, criteria: { true: `The text matches: ${what}.${example ? ` Example: "${example}"` : ""}`, false: `The text does not match: ${what}` } });

  }

  const detsFor = (chk) => S.dets.filter(d => d.scope === (chk.scope === "call" ? "call" : "person"));

  /* ---------- windows and the checkpoint runner (COPY of flow.html makeRunner; word events come from the stabiliser) ---------- */
  function personWindow(ws, spec) { const n = parseInt(spec.slice(1), 10); return ws.slice(-n).join(" "); }
  function callWindow(flat, spec) {
    const n = parseInt(spec.slice(1), 10), tail = flat.slice(-n); let out = [], prev = null;
    for (const x of tail) { if (x.spk !== prev) { out.push(`${x.spk}:`); prev = x.spk; } out.push(x.w); } return out.join(" ");
  }
  const qidsFor = (chk) => [...new Set(detsFor(chk).map(d => d.q))];
  function makeRunner() {
    const R = { people: {}, flat: [], dsince: 0 };
    const trig = (since, end, turnEnd) => S.cp === "words" ? since >= S.n : ((end || turnEnd) && since >= 3) || since >= 12;
    R.feed = (wd) => {
      const p = (R.people[wd.spk] ||= { words: [], since: 0, lastSt: null }), end = SENT_END.test(wd.w), turnEnd = wd.last;
      if (p.lastSt != null && wd.st - p.lastSt > WINDOW_GAP) { p.words = []; p.since = 0; }      // long silence: do not blend an old sentence into a new one

  /* ---------- the request: exactly what is sent to POST /v1/systemone (one call per checkpoint, every detector's question in it) ---------- */
  const sysBody = (state, qids) => ({ state, model: "jev-latest", questions: Object.fromEntries(qids.map(q => [q, QALL[q]])) });
  function validateReq(b) {

    if (!(typeof b.state === "string" && b.state.trim())) p.push("state must be a non-empty string");
    const qs = b.questions; if (!qs || typeof qs !== "object" || !Object.keys(qs).length) p.push("questions must be a non-empty object");
    else for (const [k, q] of Object.entries(qs)) { if (!["noul", "choice", "score"].includes(q.type)) p.push(`${k}: type must be noul, choice or score`); if (q.type === "noul" && q.criteria && !("true" in q.criteria || "false" in q.criteria)) p.push(`${k}: noul criteria needs true and/or false`); }

  const rec = (state) => { const k = ckey(state); if (!C.has(k)) C.set(k, { answers: {} }); return C.get(k); };
  const missing = (chk) => { const r = C.get(ckey(chk.state)); return chk.qids.filter(q => !(r && r.answers[q])); };

  }

    if (!S.scoring || !S.confirmed) { chk.skipped = true; return; }
    if (!missing(chk).length) { apply(chk, 0); return; }
    QUEUE.push(chk); while (QUEUE.length > MAX_QUEUE) { QUEUE.shift().dropped = true; N.dropped++; }   // behind: drop the oldest, never let paid calls pile up
    N.maxQueue = Math.max(N.maxQueue, QUEUE.length + active); pump();
  }
  function pump() {
    while (active < CONC && QUEUE.length) {
      if (N.calls >= S.cap) { N.capHit = true; N.dropped += QUEUE.length; QUEUE.length = 0; break; }
      const chk = QUEUE.shift(); active++; N.calls++; N.tokens += tokensOf(chk.state, missing(chk).length); ctl = ctl || new AbortController(); const c = ctl;
      fetchState(chk, c.signal).then(() => { if (!c.signal.aborted) apply(chk, performance.now() - chk.wall); })
        .catch(e => { if (!c.signal.aborted) { N.failed++; ui.err && (ui.err.textContent = `A check failed: ${e.message}`); } })

  function testMany(ds) {

  }

  const audioNow = () => V.audioS + (V.state === "running" && V.snapWall ? Math.min(1.2, (performance.now() - V.snapWall) / 1000) : 0);
