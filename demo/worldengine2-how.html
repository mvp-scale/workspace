  UI.side = el("div", { class: "gl feedcol" }, el("h3", { text: "Stories coming in" }), el("div", { class: "sub", text: "newest on top · each one flows right through the graph" }), UI.feed);

  for (let i = 0; i < FEED_N; i++) UI.feed.append(el("div", { class: "fi", style: "display:none" }, el("div", { class: "c" }), el("div", { class: "h" }), el("div", { class: "ds" }), el("div", { class: "e" })));
}
const FEED_N = 40;      // as many as the column has room for; the rest are clipped

  const rows = UI.feed.children, last = S.items.slice(-FEED_N).reverse(), fresh = last[0] && last[0] !== UI.feedTop; UI.feedTop = last[0];
