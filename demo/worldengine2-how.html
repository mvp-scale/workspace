<body>
<main class="page hw">
  <header class="hwh"><div><h1>How World engine 2 works</h1><p>The knowledge graph the engine runs on, layer by layer, with each headline lighting up its own path through it.</p></div><div style="display:flex;gap:12px;align-items:center"><button type="button" class="live" id="live" title="Headlines flow into the world model while this page is open"><i></i><span id="livet">LIVE</span></button><a href="/worldengine2">← World engine 2</a></div></header>

<script>
const { el } = Jev, $ = (id) => document.getElementById(id), api = (p, b) => Jev.api("/api/world-engine/" + p, b ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) } : undefined);
const iso = (c) => (GR.data && GR.data.iso2[c]) || null;      // headline country code -> engine country id
const DIAL_SHORT = { prices: "prices", housing_cost: "housing costs", energy_fuel: "energy costs", financial_conditions: "financing", job_security: "job security", crime: "crime", war_terror: "conflict", health_risk: "health risk", trust_institutions: "trust", community: "community", social_division: "division", tech_pace: "tech pace", disruption: "disruption", optimism: "optimism", environment: "environment", news_overload: "news overload" };
const STAGES = [
  { k: "headline", n: "1 · Headline", t: "A story arrives", tag: "real text", def: "<b>A headline from the bank</b> of 518: real feeds (BBC, NPR, Guardian, Al Jazeera, tech and science), satire, and our own funny lines, rolled in a shuffled loop. The text is real; satire is read as if it happened." },
  { k: "read", n: "2 · Read", t: "The model reads it", tag: "model read", def: "<b>Winnow-12B, running on this GPU, answers yes/no questions</b>: which of 16 conditions does it move, is it a fact, a forecast or an opinion, which country and topic. No prose, only probabilities. Time shown is the whole read." },
  { k: "spread", n: "3 · Spread", t: "It spreads", tag: "rules, strengths guessed", def: "<b>The headline enters at its country</b> and travels world → country → settlement type through channels with a gain and a delay, then fades at each condition's own rate. This step is plain arithmetic." },
  { k: "people", n: "4 · People", t: "100,000 people feel it", tag: "simulated people", def: "<b>Each modelled person</b> gets their place's change, scaled by what their audience is exposed to; their own traits turn that into a state. The GPU does all 100,000 at once. The people are simulated from stated country figures, not individuals." },
  { k: "decide", n: "5 · Decide", t: "Likelihoods move", tag: "hand-weighted rules", def: "<b>Eight decisions</b> (spend, buy, switch, move and so on) are weighted sums of a person's states, squeezed to a 0 to 100% likelihood. The weights are set by hand and are guesses until fitted." },
  { k: "show", n: "6 · Show", t: "Every place at once", tag: "measured here", def: "<b>One grouped sum</b> gives the average for every country, region and audience in a single step, however many places there are. This picture is drawn from the same numbers, change since the feed started." },
];
const S = { layout: null, d: 0, mode: "change", tick: -1, since: 0, seq: 0, on: false, items: [], gpu: null, world: null, stageSel: "read", fed: 0 };

/* ---------- stage rail + definition ---------- */
const RAIL = {};
function buildRail() {
  for (const s of STAGES) {
    const ms = el("span", { class: "ms" }), v = el("div", { class: "v", text: "waiting…" });
    const b = el("button", { type: "button", class: "stg", onclick: () => { S.stageSel = s.k; paintDef(); } }, el("div", { class: "n", text: s.n }), ms, el("div", { class: "t", text: s.t }), v);
    RAIL[s.k] = { b, ms, v }; $("rail").append(b);
  }
  paintDef();
}
function paintDef() {
  const s = STAGES.find(x => x.k === S.stageSel); $("def").replaceChildren(); const d = $("def");
  const parts = s.def.split(/<\/?b>/); d.append(el("b", { text: s.n.replace(/^\d · /, "") }), el("span", { class: "tag", text: s.tag }), el("div", { style: "margin-top:3px" }, parts[0], el("b", { text: parts[1] || "" }), parts.slice(2).join("")));
  for (const k in RAIL) RAIL[k].b.classList.toggle("sel", k === S.stageSel);
}
const fmtMs = (x) => x == null ? "" : x >= 100 ? Math.round(x) + " ms" : x.toFixed(1) + " ms";
function lightUp(it) {
  const seq = ["headline", "read", "spread", "people", "decide", "show"]; seq.forEach((k, i) => setTimeout(() => { const b = RAIL[k].b; b.classList.remove("lit"); void b.offsetWidth; b.classList.add("lit"); setTimeout(() => b.classList.remove("lit"), 900); }, i * 170));
  RAIL.headline.v.textContent = `${it.c}:${it.t}  ${it.x}`; RAIL.read.ms.textContent = fmtMs(it.read_ms); RAIL.read.v.textContent = `${(it.effects || []).length} conditions moved · ${it.src || "ticker"}`;
  RAIL.spread.ms.textContent = fmtMs(it.apply_ms); RAIL.spread.v.textContent = `world tick ${it.tick}, enters at ${it.c === "WORLD" || !iso(it.c) ? "the world" : it.c}`;
}
function paintGpuRail() {
  const g = S.gpu; if (!g) return; const m = g.ms; RAIL.people.ms.textContent = fmtMs(m.state + m.effect); RAIL.people.v.textContent = `${g.people.toLocaleString()} people · ${g.gpu ? "on the GPU" : "on the CPU"}`;
  RAIL.decide.ms.textContent = fmtMs(m.decide); RAIL.decide.v.textContent = "8 decisions per person"; RAIL.show.ms.textContent = fmtMs(m.group); RAIL.show.v.textContent = `${g.places} places in one sum`;
}

/* ---------- side panel + controls ---------- */
const UI = {};
function buildStage() {
  const st = $("stage"); UI.hov = el("div", { class: "gl hov", id: "hov" });
  UI.ctl = el("div", { class: "gl ctl" }, el("span", { class: "lb", text: "Colour by change in" }));
  UI.cap = el("div", { class: "cap2" }); UI.chips = []; GR.data.meaning.decisions.forEach((d, j) => { const c = el("button", { type: "button", class: "chip" + (j === S.d ? " on" : ""), text: d.name.replace(/ \(.*/, ""), title: d.name, onclick: () => { S.d = j; UI.chips.forEach((x, i) => x.classList.toggle("on", i === j)); grRefresh(true); } }); UI.chips.push(c); UI.ctl.append(c); }); UI.ctl.append(UI.cap);
  UI.gpu = el("div", { class: "gpu" }); UI.feed = el("div", { class: "feedl" });
  UI.what = el("p"); UI.side = el("div", { class: "gl side" }, el("div", {}, el("h3", { text: "What you are looking at" }), UI.what),
    el("div", {}, el("h3", { text: "The GPU" }), UI.gpu), el("div", { style: "flex:1;min-height:0;display:flex;flex-direction:column" }, el("h3", { text: "Latest headlines" }), UI.feed));
  UI.views = el("div", { class: "gl views" }); st.append(UI.views, UI.ctl, UI.side, UI.hov);
  for (let i = 0; i < 4; i++) UI.feed.append(el("div", { class: "fi" }, el("div", { class: "h", text: "—" }), el("div", { class: "e" })));
  UI.gpuRows = {}; for (const [k, lab] of [["state", "state"], ["effect", "effect"], ["decide", "decide"], ["group", "group"], ["spread", "spread"]]) { const bar = el("i"), ms = el("span", { class: "ms", text: "" }); UI.gpuRows[k] = { bar, ms }; UI.gpu.append(el("div", { class: "row" }, el("span", { text: lab }), el("div", { class: "bar" }, bar), ms)); }
  UI.dev = el("div", { class: "dev", text: "…" }); UI.mem = el("div", { class: "mem", text: "" }); UI.gpu.prepend(UI.dev, UI.mem);
}
function paintGpu() {
  const g = S.gpu; if (!g) return; UI.dev.textContent = g.gpu ? g.device : "CPU (no GPU found)"; UI.mem.textContent = g.gpu ? `${g.engine_mb} MB of tensors held · ${(g.free_mb / 1000).toFixed(1)} of ${(g.total_mb / 1000).toFixed(1)} GB free` : `${g.people.toLocaleString()} people`;
  const mx = Math.max(...Object.values(g.ms), 0.1); for (const k in UI.gpuRows) { const v = g.ms[k]; UI.gpuRows[k].bar.style.width = Math.max(3, v / mx * 100) + "%"; UI.gpuRows[k].ms.textContent = fmtMs(v); }
}
function paintFeed() {
  const rows = UI.feed.children, last = S.items.slice(-4).reverse();
  for (let i = 0; i < rows.length; i++) { const it = last[i], r = rows[i]; if (!it) continue; r.classList.toggle("new", i === 0); r.children[0].textContent = `${it.c}:${it.t}  ${it.x}`; r.children[1].replaceChildren(...(it.effects || []).slice(0, 3).map(e => el("span", { class: e.dir === "up" ? "u" : "d", text: `${e.dir === "up" ? "▲" : "▼"} ${DIAL_SHORT[e.dial] || e.name}` }))); }
}


/* ---------- knowledge graph (Canvas 2D): the real layers the engine runs on, live heat, and each headline's path ---------- */
const GR = { data: null, view: "meaning", layers: { topics: true, conditions: true, states: true, decisions: true, resources: false }, nodes: new Map(), cols: [], edges: [], adj: new Map(), cam: null, tcam: null, fit: 1, hover: null, tcache: new Map(), HL: 560, pad: 250, particles: [], dirty: true, cv: null, ctx: null, W: 0, H: 0, story: null, last: 0 };
const COLW = 280, ROW = 36, TOPN = 14, NEU = [130, 145, 175], POS = [79, 143, 247], NEG = [233, 132, 59];
const LAYER_INFO = { topics: "Topics", conditions: "Conditions", states: "Person states", decisions: "Decisions", resources: "Resources" };
const VIEW_TEXT = {
  meaning: ["The knowledge graph the engine runs on. ", "A story is placed in one of 14 topics, which can move 16 world conditions; those change 15 states of a person; those weigh into 8 decisions. Every line is a real rule: its width is the strength, blue raises and orange lowers. Node colour is the live world, how far it has moved since the feed started. Each headline sends light along its own path. Hover a node to see its definition and strongest links."],
  places: ["How a story reaches people. ", "It enters the world, passes to a country (the biggest are shown, the rest are grouped), then to that country's metro, town and rural parts, and reaches each modelled person there. Every person also belongs to an audience, which scales how much of it they feel. Colour is the change in the chosen decision since the feed started."],
};
function grModel() {
  const m = GR.data.meaning, P = GR.data.places, cols = [], edges = [], L = GR.layers, add = (key, label, nodes, gap) => cols.push({ key, label, nodes, gap });
  const node = (id, name, def, kind, extra) => Object.assign({ id, name, def: def || "", kind, glow: 0, val: 0, heat: 0, hs: 0, vs: 0, flash: 0, fsign: 1, hold: 0 }, extra);
  add("story", "Story", [node("story", "A story arrives", "A headline, read by the model. It enters the graph at the layer on its right.", "story")], 0.78);
  if (GR.view === "meaning") {
    if (L.topics) add("topics", "Topics (14)", m.topics.map(t => node("t:" + t.id, t.name, t.definition, "topic", { status: t.status })), 1);
    if (L.conditions) add("conditions", "Conditions (16)", m.conditions.map(c => node("c:" + c.id, c.name, c.definition, "condition")), 1);
    if (L.states) add("states", "Person states (15)", m.states.map(c => node("s:" + c.id, c.name, c.definition, "state")), 1);
    if (L.decisions) add("decisions", "Decisions (8)", m.decisions.map(c => node("d:" + c.id, c.name, "What a person might choose to do. Likelihood is a weighted sum of person states.", "decision")), 1);
    if (L.resources) add("resources", "Resources (10)", m.resources.map(c => node("r:" + c.id, c.name, c.definition, "resource")), 1);
    const has = (k) => cols.some(c => c.key === k), E = (list, pa, pb, kind) => { for (const e of list) edges.push({ a: pa + e.a, b: pb + e.b, w: e.w, kind }); };
    if (has("topics") && has("conditions")) E(m.topic_condition, "t:", "c:", "topic");
    if (has("conditions") && has("states")) E(m.condition_state, "c:", "s:", "signed");
    if (has("states") && has("decisions")) E(m.state_decision, "s:", "d:", "signed");
    if (has("topics") && has("resources")) E(m.topic_resource, "t:", "r:", "topic");
    if (cols[1]) for (const n of cols[1].nodes) edges.push({ a: "story", b: n.id, w: 0.25, kind: "story" });
  } else {
    const byPop = [...P.countries].sort((a, b) => b.pop_m - a.pop_m), top = byPop.slice(0, TOPN), rest = byPop.slice(TOPN); GR.top = new Set(top.map(c => c.id)); GR.restIds = rest.map(c => c.id);
    add("world", "World", [node("w", "World", "The whole world. A story with no country of ours lands here first.", "place", { rows: ["WORLD:world"] })], 0.85);
    add("countries", `Countries (${P.countries.length})`, [...top.map(c => node("co:" + c.id, c.name, `${c.pop_m.toLocaleString()} M people in the real country.`, "place", { rows: ["COUNTRY:" + c.id] })),
      ...(rest.length ? [node("co:rest", `${rest.length} more countries`, `The other ${rest.length} countries together (${rest.reduce((a, c) => a + c.pop_m, 0).toLocaleString()} M people). Hover the People view for each one.`, "place", { rows: rest.map(c => "COUNTRY:" + c.id) })] : [])], 1);
    add("regions", "Parts of each country", P.settles.map(x => node("st:" + x.id, x.name, "The metro, town or rural part of every country. Each country has its own channel to each part; shown here pooled across countries.", "place", { rows: P.countries.map(c => `REGION:${c.id}-${x.id}`) })), 1);
    add("people", "People", [node("p", `${GR.data.people.toLocaleString()} modelled people`, "Each person has a place, an audience and their own traits. The GPU works out all of them at once.", "place", { rows: ["WORLD:world"] })], 0.95);
    add("audiences", "Audiences (8)", P.audiences.map(a => node("au:" + a.id, a.name, `${(a.share * 100).toFixed(0)}% of people. Audiences are groups found from traits and habits; they cut across countries and scale what each person feels.`, "place", { rows: ["AUDIENCE:" + a.id] })), 1);
    edges.push({ a: "story", b: "w", w: 1, kind: "topic" });
    const co = cols[2].nodes; for (const c of co) { edges.push({ a: "w", b: c.id, w: c.id === "co:rest" ? 0.6 : 0.6, kind: "topic" }); for (const x of P.settles) edges.push({ a: c.id, b: "st:" + x.id, w: 1, kind: "topic" }); }
    for (const x of P.settles) edges.push({ a: "st:" + x.id, b: "p", w: 0.6, kind: "topic" });
    for (const a of P.audiences) edges.push({ a: "au:" + a.id, b: "p", w: Math.max(0.25, a.share * 3), kind: "topic" });
  }
  // untangle: sweep the columns, ordering each by the average position of the nodes it is linked to (both sides), several times
