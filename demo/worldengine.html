<body>
<main class="page we">
  <header class="we-head"><div><h1>World engine</h1><p>Ask about anything, large or small. See where it lands, and what pulls it up or down.</p></div><button class="btn" id="dataBtn" type="button">Data &amp; rules</button></header>

</main>
<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Data and rules"></aside>
