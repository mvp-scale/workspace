<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call cockpit · Jev Bench Console</title>
<meta name="description" content="A real transcript replayed word by word through the loaded models, one colour per diarized speaker: per-person signals that rise, hold and fade, cue cards for everyone else, and coaching for the person you pick.">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
<style>
  /* Layout the shared CSS lacks. Colours come from shared tokens only (speaker colours are --s1 to --s8, a ninth speaker is neutral). */
  [hidden] { display: none !important; }
  .footer { display: none; }
  .page.cockpit { max-width: none; padding: 8px var(--gutter) 10px; }
  .cp { display: flex; flex-direction: column; gap: 8px; height: calc(100dvh - 42px - 18px); min-height: 620px; }

  .pill .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .pill.on .rec { background: var(--bad); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.8); } }
  .notice { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

  .spknote { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .wadd { display: flex; gap: 6px; min-width: 0; }
  .wadd input, .wadd select { min-width: 0; min-height: 26px; padding-top: 2px; padding-bottom: 2px; } .wadd .segmented, .wadd .btn { flex: none; } .wadd .btn { min-height: 26px; padding-top: 1px; padding-bottom: 1px; }
  .wnote { position: absolute; right: 12px; top: calc(100% + 2px); z-index: 25; max-width: 60%; padding: 3px 9px; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .wnote:empty { display: none; }

  /* Stage: signals per person, conversation, rail (cues | coaching, captured), history */
  .stage { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr) clamp(110px, 14vh, 190px); grid-template-areas: "lanes lanes" "conv rail" "chart chart"; }
  .pn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  .pn > header .r { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .pn > .bd { padding: 6px 12px 10px; flex: 1; min-height: 0; display: flex; min-width: 0; position: relative; }
  .pn > .bd > * { flex: 1; min-width: 0; }
  #lanebox { min-height: 100px; max-height: clamp(130px, 20vh, 190px); overflow: auto; }
  .lane { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: center; padding: 3px 12px 3px 9px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; }
  .lane:last-child { border-bottom: 0; }
  .lane.speaking { border-left-color: var(--c); background: color-mix(in srgb, var(--c) 6%, transparent); }
  .lane .lh { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .lane .lh b { font-size: 12px; font-weight: 650; white-space: nowrap; }
  .pdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--text-3)); flex: none; }
  .lane .rt { font: 500 10px var(--mono); color: var(--accent); }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 14px; min-height: 36px; align-items: center; }
  .sg { padding: 1px 0; min-width: 0; }
  .sg .r1 { display: flex; align-items: center; gap: 6px; min-height: 17px; }
  .sg .lb { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sg .tr { font: 500 10px var(--mono); color: var(--text-3); white-space: nowrap; flex: none; } .sg .tr.warn { color: var(--warn); }
  .sg .st { margin-left: auto; width: 92px; text-align: right; font: 500 11px var(--mono); color: var(--text-2); white-space: nowrap; overflow: hidden; flex: none; }
  .sg .x { border: 0; background: transparent; color: var(--text-3); cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; opacity: 0; } .sg:hover .x, .sg .x:focus-visible { opacity: 1; }
  .sg .r2 { display: flex; align-items: center; gap: 6px; }
  .sg .mt { position: relative; height: 6px; flex: 1; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .sg .mt i { position: absolute; inset: 0; background: var(--c); transform-origin: left; transform: scaleX(0); }
  .sg .mt b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .55; }
  .sg .pc { font: 500 11px var(--mono); color: var(--text-2); min-width: 30px; text-align: right; }
  .sg.quiet { opacity: .7; }

  .glide { position: relative; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 100%); }

  .msg { display: flex; gap: 8px; margin: 9px 0; align-items: flex-end; } .msg.coach { flex-direction: row-reverse; }
  .av { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--c); margin-bottom: 6px; }
  .bub { max-width: min(82%, 640px); padding: 7px 12px 8px; border-radius: 14px 14px 14px 5px; background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--c); font-size: clamp(14px, 0.4vw + 11px, 17px); line-height: 1.65; }
  .msg.coach .bub { border-radius: 14px 14px 5px 14px; border-left: 1px solid var(--border); border-right: 4px solid var(--c); background: var(--accent-soft); }
  .who2 { display: flex; gap: 8px; font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); line-height: 1.4; } .who2 .ts { font: 500 10.5px var(--mono); }
  .txt { position: relative; } .txt .ghost { visibility: hidden; user-select: none; padding-right: 8px; } .txt .words { position: absolute; left: 0; top: 0; width: 100%; }
  .w { display: inline-block; animation: wordin .26s ease-out both; } @keyframes wordin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .w.out { color: var(--text-3); }
  .caret { display: inline-block; width: 0; height: 1.05em; position: relative; vertical-align: text-bottom; } .caret::after { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px; background: var(--accent); animation: caret 1s steps(2) infinite; } @keyframes caret { 50% { opacity: 0; } }
  .ph { background: color-mix(in srgb, var(--c) 20%, transparent); box-shadow: inset 0 -2px 0 var(--c); border-radius: 3px; margin: 0 -2px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .readnote { font-size: 11px; color: var(--text-3); padding: 0 12px 8px; }

  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 8px; flex: 1 1 0; min-height: 130px; }
  .stackroot { position: relative; overflow: hidden; }
  .moment { border: 1px solid var(--border-strong); border-left: 4px solid var(--c); border-radius: var(--radius-sm); padding: 4px 8px 5px; background: var(--surface); height: 46px; overflow: hidden; }
  .moment.cool { background: var(--surface-2); border-color: var(--border); border-left-color: var(--c); } .moment.cool .q { color: var(--text-3); }
  .moment .mh { display: flex; align-items: center; gap: 6px; height: 20px; min-width: 0; }
  .moment .code { font: 600 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border-strong); white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
  .moment .q { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .moment .age { margin-left: auto; font: 500 10.5px var(--mono); color: var(--text-3); white-space: nowrap; }
  .moment .ft { display: flex; align-items: center; gap: 2px; height: 16px; min-width: 0; margin-top: 1px; }
  .moment .n { font-size: 11.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; margin-right: auto; }
  .moment .btn { font-size: 11px; padding: 0 5px; line-height: 14px; min-height: 0; }
  .moment .hold { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--border); } .moment .hold i { display: block; height: 100%; background: var(--c); transform-origin: left; }
  .scroll { overflow: auto; min-height: 0; }
  .bt { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 2px 0 4px; }
  .split { position: relative; height: 9px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .split i { position: absolute; top: 0; bottom: 0; width: 100%; } .split .th { left: 0; background: var(--text-3); transform-origin: left; transform: scaleX(.5); } .split .me { right: 0; background: var(--c, var(--accent)); transform-origin: right; transform: scaleX(.5); }
  .bl { font: 500 11px var(--mono); color: var(--text-2); margin: 4px 0 6px; min-height: 14px; } .tip { font-size: 12.5px; min-height: 18px; }
  .ck { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: center; }
  .ck .g { font: 700 12px var(--mono); color: var(--text-3); } .ck.done .g { color: var(--good); } .ck .ts { font: 500 10.5px var(--mono); color: var(--text-3); }
  .ck button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
  .rf { font-size: 12px; color: var(--text-2); padding: 2px 0; overflow-wrap: anywhere; }
  .mrow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
  .mrow .l { font-size: 12px; color: var(--text-3); } .mrow .segmented button { padding: 3px 8px; }
  .mbtn { display: inline-flex; gap: 6px; align-items: baseline; }
  .mbtn small { font: 500 10.5px var(--mono); color: var(--text-3); }
  .est { font: 500 11px var(--mono); color: var(--text-2); }
  .tabs2 { display: flex; gap: 2px; margin-top: 6px; border-bottom: 1px solid var(--border); }
  .tabs2 button { border: 0; background: transparent; padding: 4px 10px; font: inherit; font-size: 12.5px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs2 button[aria-selected=true] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .lst { flex: 1; min-height: 0; overflow: auto; margin-top: 4px; }
  .li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; } .li .ts { font: 500 11px var(--mono); color: var(--text-3); }
  .li .q { color: var(--text-2); overflow-wrap: anywhere; }
  .chartwrap { position: relative; flex: 1; min-height: 0; padding: 4px 10px 8px; } .chartwrap canvas { position: absolute; inset: 4px 10px 8px; width: calc(100% - 20px); height: calc(100% - 12px); }
  .key { display: inline-flex; gap: 14px; font-size: 12px; color: var(--text-2); align-items: center; } .key i { display: inline-block; width: 22px; border-top: 2px solid var(--text-2); vertical-align: middle; margin-right: 6px; } .key i.d { border-top-style: dashed; }
  .tabsbar { display: none; }
  @media (max-width: 1000px) {
    .cp .ctl { margin-left: 0; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "x"; }
    .stage > [data-pane] { grid-area: x; display: none; }
    .stage[data-tab="talk"] > [data-pane="talk"], .stage[data-tab="signals"] > [data-pane="signals"], .stage[data-tab="cues"] > [data-pane="cues"], .stage[data-tab="history"] > [data-pane="history"] { display: flex; flex-direction: column; }
    .stage[data-tab="cues"] > [data-pane="cues"] { overflow: auto; }
    #lanebox { max-height: none; flex: 1; }
    .cols { grid-template-columns: 1fr; flex: 0 0 auto; }
    .tabsbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: var(--surface); }
    .tabsbar button { border: 0; background: transparent; padding: 10px 4px; font: inherit; font-size: 12px; color: var(--text-3); border-top: 2px solid transparent; cursor: pointer; }
    .tabsbar button[aria-selected=true] { color: var(--text); border-top-color: var(--text); font-weight: 600; }
  }
  @media (max-width: 560px) { .lane { grid-template-columns: 1fr; gap: 2px; } .bub { max-width: 92%; } .cp .top .sub { display: none; } }
  @media (prefers-reduced-motion: reduce) { .w, .caret::after, .pill.on .rec { animation: none; } }
</style>
</head>
<body>
<main class="page cockpit"><div id="app"></div></main>
<script>
(() => {
  const { el, fmt, api, toast, copy, download } = Jev;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mmss = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const words = (s) => String(s).split(/\s+/).filter(Boolean);
  const SENT_END = /[.!?…]["')\]]*$/;
  const HOLD = 30, MAXROLE = 6, CONC = 3, PER_Q = 110, LIVE_STREAMS = 4;
  const SPEEDS = [["0.5", "0.5x"], ["1", "1x"], ["2", "2x"], ["4", "4x"], ["30", "Max"]];
  const WINS = ["w5", "w10", "w20", "w40", "s1", "s2", "s3"];
  const winName = (s) => `last ${s.slice(1)} ${{ w: "word", s: "sentence" }[s[0]]}${s.slice(1) === "1" ? "" : "s"}`;
  const short = (n) => String(n).replace(/ \(.*\)/, "");
  let TARIFF = 0.042;

  /* Nine validated question sets, eleven detectors. `scope` says what text the detector was validated on: one person's words, or a whole dialogue. */
  const QSETS = { manipulation: "manipulation_dialogue", phishing: "phishing", sarcasm: "sarcasm_isarcasm", threat: "threat_civil", anger: "emotion_anger", fear: "emotion_fear", politeness: "politeness_deference", darkpatterns: "darkpatterns", persuasion: "persuasion_appeals" };
  const PERSP = [
    { id: "manipulation", ab: "Man", name: "Manipulation", q: "manipulation", read: "noul", scope: "call", about: "Does one speaker try to manipulate the other? Validated on whole dialogues, so it reads the whole call, not one person." },
    { id: "phishing", ab: "Dec", name: "Deceptive request", q: "phishing", read: "noul", scope: "person", about: "Is the text trying to get credentials or money through deception?" },
    { id: "sarcasm", ab: "Sar", name: "Sarcasm", q: "sarcasm", read: "noul", scope: "person", about: "Does the speaker mean the opposite of the literal words?" },
    { id: "threat", ab: "Thr", name: "Threat", q: "threat", read: "noul", scope: "person", about: "Does the text threaten to harm the listener?", caveat: "The threat set has label noise, so treat its accuracy as a rough guide." },
    { id: "anger", ab: "Ang", name: "Anger", q: "anger", read: "noul", scope: "person", about: "Does the text express anger?" },
    { id: "fear", ab: "Fea", name: "Fear", q: "fear", read: "noul", scope: "person", about: "Does the text express fear or nervousness?" },
    { id: "politeness", ab: "Pol", name: "Politeness", q: "politeness", read: "noul", scope: "person", about: "Is the speaker polite and deferential to the person addressed?" },
    { id: "urgency", ab: "Urg", name: "Urgency", q: "darkpatterns", read: "urgency", scope: "person", about: "P(urgency) from the dark-pattern question: a deadline pushing a quick decision.", caveat: "Validated on short shopping-site text." },
    { id: "scarcity", ab: "Sca", name: "Scarcity", q: "darkpatterns", read: "scarcity", scope: "person", about: "P(scarcity) from the dark-pattern question: something may run out.", caveat: "Validated on short shopping-site text." },
    { id: "social_proof", ab: "Soc", name: "Social proof", q: "darkpatterns", read: "social_proof", scope: "person", about: "P(social_proof) from the dark-pattern question: what others did or said.", caveat: "Validated on short shopping-site text." },
    { id: "persuasion", ab: "Per", name: "Persuasive move", q: "persuasion", read: "appeal", scope: "person", about: "1 minus P(none) from the persuasion-appeal question.", caveat: "Validated on donation appeals to a charity; other contexts are outside what was measured." },
  ];
  const P_BY = Object.fromEntries(PERSP.map(p => [p.id, p]));
  /* Signals belong to a role: everyone else (cue cards), the coached person (coaching), or the whole call. */
  const DEFAULTS = [["anger", "others"], ["fear", "others"], ["urgency", "others"], ["threat", "others"], ["politeness", "coach"], ["anger", "coach"], ["urgency", "coach"], ["manipulation", "call"]];
  const ROLE_NAME = { others: "everyone else", coach: "the coached person", call: "the whole call" };

  const S = { src: null, dlg: null, coach: null, names: false, model: null, win: "w20", winTouched: false, cp: "sentence", n: 5, gate: 0.8, speed: "1", mode: "live", armed: false, playing: false, t: 0, done: false, sigs: [], seq: 0, tab: "flag", chartSig: null };
  let D = null, T = null, W = [], DUR = 0, ptr = 0, raf = 0, last = performance.now(), runner = null, ui = {}, QS = {}, QALL = {}, EVENTS = [], SP = { list: [], by: {} };
  const C = new Map(), CPS = [], FLAGS = [], LAGS = {}, QUEUE = [], LOGW = [], rows = [], peopleSpans = {}, cards = [], SPOKE = [];
  let active = 0, ctl = null, failed = 0, pending = 0, maxPending = 0, moSeq = 0, nextSample = 0, checksDone = 0, pre = null, cpN = 0, glide = null, stack = null, chart = null, curSpk = null, LROWS = {};
  const kv = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  /* ---------- speakers: diarization gives ids, not names, so each is "Person N" with one colour ---------- */
  function buildSpeakers() {
    SP = { list: [], by: {} };
    T.speakers.forEach((name, i) => { const n = i + 1, p = { name, n, label: `Person ${n}`, css: n <= 8 ? `var(--s${n})` : "var(--text-3)" }; SP.list.push(p); SP.by[name] = p; });
    if (window.__cockpit) window.__cockpit.SP = SP;
  }
  const lab = (spk) => S.names ? short(spk) : (SP.by[spk] ? SP.by[spk].label : spk);
  const pcss = (spk) => `--c:${SP.by[spk] ? SP.by[spk].css : "var(--text-3)"}`;
  const roleOf = (spk) => spk === S.coach ? "coach" : "others";

  /* ---------- transcript, timeline ---------- */
  function makeTranscript(turns, meta) {
    const ts = turns.map(t => ({ speaker: String(t.speaker), text: words(t.text).join(" "), words: words(t.text) }));
    return { turns: ts, meta, speakers: [...new Set(ts.map(t => t.speaker))] };
  }
  function parsePaste(text) {
    const turns = [];
    for (const raw of text.split(/\n/)) {
      const line = raw.trim(); if (!line) continue;
      const m = line.match(/^([^:]{1,40}):\s*(.*)$/);
      if (m) { if (m[2].trim()) turns.push({ speaker: m[1].trim(), text: m[2].trim() }); }
      else if (turns.length) turns[turns.length - 1].text += " " + line; else turns.push({ speaker: "Speaker", text: line });
    }
    return turns;
  }
  function currentTranscript() {
    if (S.src === "paste") return makeTranscript(parsePaste(S.paste), { kind: "paste", title: "Pasted text" });
    if (S.src === "dlg") { const d = D.dialogues.find(x => x.id === S.dlg) || D.dialogues[0]; return makeTranscript(d.turns, { kind: "dialogue", title: "Library dialogue " + d.id, d }); }
    const s = D.scenes.find(x => x.slug === S.src) || D.scenes[0]; return makeTranscript(s.turns, { kind: "scene", title: s.title, s });
  }
  /* The timeline is what a live speech-to-text source would produce: words with a speaker and a time. Replay generates it at about 150 words a minute. */
  function buildTimeline() {
    W = []; let t = 0.05;
    T.turns.forEach((tu, i) => {
      tu.t0 = t;
      tu.words.forEach((w, k) => { W.push({ i, k, w, spk: tu.speaker, t }); t += 0.18 + 0.045 * w.replace(/\W/g, "").length; if (/[,;]$/.test(w)) t += 0.1; if (SENT_END.test(w)) t += 0.35; });
      tu.t1 = t; t += 0.8;
    });
    DUR = t;
    const ev = (T.meta.s && T.meta.s.documented_events) || [];
    EVENTS = ev.map((e, n) => ({ n: n + 1, t: (T.turns[e.turn_index] || T.turns[0]).t0, turn: e.turn_index, what: e.what_happened, quote: e.evidence_quote, url: e.evidence_source_url }));
  }

  /* ---------- signals: a definition per role, a state per person ---------- */
  const newState = () => ({ latest: 0, marks: [], disp: 0, lastFire: -1e9, above: null, hist: [], n: 0 });
