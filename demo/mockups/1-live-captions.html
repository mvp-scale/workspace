<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live captions</title>
<link rel="stylesheet" href="mock.css">
<style>
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; align-items: start; }
  .left { display: grid; gap: 12px; min-width: 0; }
  .caps { height: 520px; padding: 0 16px; }
  #view { height: 100%; }
  .row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 180px; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .txt { font-size: 20px; line-height: 1.5; }
  .margin { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; padding-top: 3px; }
  .tag { display: grid; gap: 1px; animation: tagin .45s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes tagin { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  .tag .n { font-size: 12px; line-height: 1.3; color: var(--ink-2); }
  .tag .cf { font: 500 10px var(--mono); color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; margin-left: 4px; }
  #sigs { min-height: 372px; }
  #moms { height: 368px; }
  #ch { height: 190px; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; gap: 4px; } .caps { height: 340px; } }
</style></head>
<body><div class="wrap">
  <div class="bar"><a class="back" href="index.html">&larr; Mock-ups</a><h1>Live captions</h1><span class="sp"></span><span id="pick"></span><span id="pill"></span><span id="ctl"></span></div>
  <div id="banner"></div>
  <div id="wbar"></div>
  <div class="main">
    <div class="left">
      <section class="panel"><header><h2>Transcript</h2></header><div class="caps"><div class="glide" id="view"><div class="track" id="track"></div></div></div></section>
      <section class="panel"><header><h2>Last 60 seconds</h2></header><div class="body"><div class="chart" id="ch"><canvas></canvas></div></div></section>
    </div>
    <aside class="left">
      <section class="panel"><header><h2>Signals</h2></header><div class="body" id="sigs"></div></section>
      <section class="panel"><header><h2>Flagged moments</h2><span class="mute" style="margin-left:auto;font-size:12px" id="more"></span></header><div class="body"><div id="moms"></div></div></section>
    </aside>
  </div>
</div>
<script src="apollo.js"></script><script src="data.js"></script><script src="mock.js"></script>
<script>
const { h } = Mock;
let S;
function load(scn) {
  if (S) S.destroy();
  for (const id of ["track", "sigs", "moms", "wbar", "banner", "pill", "ctl"]) document.getElementById(id).replaceChildren();
  const cv = document.querySelector("#ch canvas"), fresh = cv.cloneNode(); cv.replaceWith(fresh);
  S = Mock.Session(scn);
  document.getElementById("banner").append(Mock.Banner(scn));
  document.getElementById("pill").append(Mock.LivePill(S));
  document.getElementById("ctl").append(Mock.Controls(S));
  Mock.WatchEditor(S, document.getElementById("wbar"));
  Mock.Transcript(S, document.getElementById("view"), document.getElementById("track"), {
    build(i, tu) {
      const words = h("div", { class: "txt" }), margin = h("div", { class: "margin" });
      return { words, margin, el: h("div", { class: "row" }, h("div", { class: "spk" }, tu.speaker), words, margin) };
    },
    tag(m, item) {
      return h("div", { class: "tag", "data-flag": m.id }, h("span", null, h("span", { class: "code", style: Mock.cvar(item.slot) }, m.code), h("span", { class: "cf" }, m.p >= 0.85 ? "strong" : m.p >= 0.65 ? "likely" : "weak")), h("span", { class: "n" }, m.note));
    },
  });
  Mock.Signals(S, document.getElementById("sigs"));
  Mock.Moments(S, document.getElementById("moms"), { more: document.getElementById("more") });
  Mock.Chart(S, fresh, { window: 60 });
  S.start();
}
document.getElementById("pick").append(Mock.Picker(Mock.byId("meeting"), load));
load(Mock.byId("meeting"));
</script></body></html>
