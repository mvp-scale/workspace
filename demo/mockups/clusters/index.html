          table(["Similarity", "Headline of the neighbour", "Cluster that neighbour ended up in"], e.nearest.map(function (n) { return [n.similarity.toFixed(2), n.title, n.cluster < 0 ? "none (noise)" : "cluster " + n.cluster + (n.cluster === b.cluster ? " (the same as this article)" : "")]; }), [0]))));

    var tb = D.title_body_similarity, q = tb.quantiles;
    var body = el("div");
    body.appendChild(el("p", { text: "Agreement = among articles clustered at both levels, how many land in the matching cluster (each cluster is matched to the cluster it overlaps most). Views with different numbers of clusters will disagree partly for that reason." }));
    body.appendChild(table(["Pair of views (level)", "Clustered in both", "Agree", "Noise in either"], ar, [1, 2, 3]));
    body.appendChild(el("p", { text: "A cleaner change signal ignores clusters: " + tb.what + ". Median " + q.p50 + ", lowest 5% below " + q.p5 + ". The lowest cases:" }));
    body.appendChild(table(["Similarity", "Title", "Start of the body"], tb.lowest.slice(0, 12).map(function (x) { return [x.sim, x.title, el("span", { class: "ex", text: x.snippet })]; }), [0]));
    body.appendChild(el("p", { text: "What the lowest cases are: titles that are only a site name (for example a newspaper or radio station), and bodies that belong to a different story than the title. So title against body flags bad scrapes before it flags a real change of view." }));
    app.appendChild(box("4. Title against body", null, body, SRC + "#agreement, #title_body_similarity"));

    // 5. honesty
    var lim = el("div");
    ["The first run used PCA instead of UMAP and failed: broad mode collapsed to a few clusters and specific mode left most articles as noise. UMAP fixed it. The sweeps are in runs/harvest/topic_shape_sweep.json (PCA) and runs/harvest/topic_shape_umap_sweep.json (UMAP).",
     "Settings were picked by agreement with our own reader's topics, so the reader-topic scores are optimistic. The URL-section scores were not used to choose settings and are the fairer figure, but only some articles have a URL section (see the last column of section 1).",
     "Noise runs from " + pct(Math.min.apply(null, Object.keys(D.runs).map(function (k) { return D.runs[k].noise_share; }).filter(function (x) { return x > 0.05; }))) + " to " + pct(Math.max.apply(null, Object.keys(D.runs).map(function (k) { return D.runs[k].noise_share; }))) + " of articles across the runs above. Noise is the novelty pool, but it is also just articles that sit alone in their neighbourhood.",
     "Clusters say which articles are alike, not why. Naming them, and judging whether a title-body difference is a change of view, needs a judge on a sample.",
     "Embeddings ran on the 5090; clustering is CPU. umap-learn was installed in an isolated folder, not the shared environment."
    ].forEach(function (t) { lim.appendChild(el("p", { text: t })); });
    app.appendChild(box("5. What this does not show", null, lim));
  }
})();
