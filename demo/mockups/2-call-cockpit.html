<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call cockpit</title>
<link rel="stylesheet" href="mock.css">
<style>
  .wavebar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px 14px; margin-bottom: 12px; }
  .stripwrap { padding: 4px 14px; margin-bottom: 12px; }
  .main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 12px; margin-bottom: 12px; }
  .chat { height: 640px; padding: 0 14px; }
  #view { height: 100%; }
  .bub { margin: 10px 0; max-width: 86%; padding: 10px 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
  .bub.r { margin-left: auto; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .rail { display: grid; gap: 12px; align-content: start; }
  #moms { height: 368px; }
  #facts { height: 170px; }
  .fact { display: grid; grid-template-columns: 42% 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; background: var(--surface); }
  .fact span:first-child { color: var(--ink-3); }
  .bottom { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  #ch { height: 190px; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; } .chat { height: 340px; } .wavebar { grid-template-columns: 1fr; } }
</style></head>
<body><div class="wrap">
  <div class="bar"><a class="back" href="index.html">&larr; Mock-ups</a><h1>Call cockpit</h1><span class="sp"></span><span id="pick"></span><span id="pill"></span><span id="ctl"></span></div>
  <div id="banner"></div>
  <div class="panel wavebar"><span class="mute" style="font-size:12px">Audio (simulated)</span><canvas class="wave" id="wave"></canvas><span class="mute mono" style="font-size:12px" id="who"></span></div>
  <div id="wbar"></div>
  <section class="panel stripwrap" aria-label="Signal levels"><div class="strip" id="sigs" style="padding:0"></div></section>
  <div class="main">
    <section class="panel"><header><h2>Conversation</h2></header><div class="chat"><div class="glide" id="view"><div class="track" id="track"></div></div></div></section>
    <div class="rail">
      <section class="panel"><header><h2>Cue cards</h2><span class="mute" style="margin-left:auto;font-size:12px" id="more"></span></header><div class="body"><div id="moms"></div></div></section>
      <section class="panel"><header><h2>Captured so far</h2></header><div class="body"><div id="facts"></div></div></section>
    </div>
  </div>
  <section class="panel"><header><h2>Last 60 seconds</h2></header><div class="body"><div class="chart" id="ch"><canvas></canvas></div></div></section>
</div>
<script src="apollo.js"></script><script src="data.js"></script><script src="mock.js"></script>
<script>
const { h } = Mock;
let S;
function load(scn) {
  if (S) S.destroy();
  for (const id of ["track", "sigs", "moms", "facts", "wbar", "banner", "pill", "ctl"]) document.getElementById(id).replaceChildren();
  const cv = document.querySelector("#ch canvas"), fresh = cv.cloneNode(); cv.replaceWith(fresh);
  const wv = document.getElementById("wave"), wf = wv.cloneNode(); wv.replaceWith(wf);
  S = Mock.Session(scn); const first = scn.turns[0].speaker;
  document.getElementById("banner").append(Mock.Banner(scn));
  document.getElementById("pill").append(Mock.LivePill(S));
  document.getElementById("ctl").append(Mock.Controls(S));
  Mock.Wave(S, wf); Mock.WatchEditor(S, document.getElementById("wbar"));
  const who = document.getElementById("who"); S.onTurn((i, tu) => { who.textContent = "speaking: " + tu.speaker; }); S.onReset(() => { who.textContent = ""; });
  Mock.Transcript(S, document.getElementById("view"), document.getElementById("track"), {
    build(i, tu) { const words = h("div"); return { words, el: h("div", { class: "bub" + (tu.speaker !== first ? " r" : "") }, h("div", { class: "spk" }, tu.speaker), words) }; },
  });
  Mock.Signals(S, document.getElementById("sigs"));
  Mock.Moments(S, document.getElementById("moms"), { more: document.getElementById("more") });
  const fs = Mock.Stack(S, document.getElementById("facts"), 0);
  S.onFire((m) => { if (m.fact) fs.add(h("div", { class: "fact", "data-flag": m.id }, h("span", null, m.fact[0]), h("b", null, m.fact[1]))); });
  S.onReset(() => fs.clear());
  Mock.Chart(S, fresh, { window: 60 });
  S.start();
}
document.getElementById("pick").append(Mock.Picker(Mock.byId("sales"), load));
load(Mock.byId("sales"));
</script></body></html>
