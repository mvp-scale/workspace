<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; margin-bottom: 10px; }

  .card h2 { margin: 0 0 2px; font-size: 15px; }

  .what { margin: 0 0 6px; color: var(--ink-3); font-size: 13px; }

  .sent { margin: 0 0 6px; padding: 5px 8px 5px 10px; border-left: 4px solid var(--line-2); border-radius: 4px; font-size: 14px; line-height: 1.6; }
  .sent .n { font: 500 11px var(--mono); color: var(--ink-3); margin-right: 6px; white-space: nowrap; }
  .sent.hit { background: color-mix(in srgb, var(--accent) 12%, transparent); border-left-color: var(--accent); }
  mark { background: transparent; color: inherit; padding: 0 1px; border-bottom: 2px solid var(--ink-3); border-radius: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .legend mark { font-size: 12px; padding: 1px 6px; white-space: nowrap; }
  mark.entity { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 13%, transparent); }
  mark.quantity, mark.money, mark.percent { border-color: var(--s2); background: color-mix(in srgb, var(--s2) 16%, transparent); }
  mark.date { border-color: var(--s4); background: color-mix(in srgb, var(--s4) 22%, transparent); }
  mark.change { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 16%, transparent); }
  mark.event { border-color: var(--s6); background: color-mix(in srgb, var(--s6) 12%, transparent); }
  mark.attribution { border-color: var(--s5); background: color-mix(in srgb, var(--s5) 14%, transparent); }
  mark.modal { border-color: var(--s4); } mark.negation { border-color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
  mark.quote { border-color: var(--line-2); background: color-mix(in srgb, var(--ink-3) 10%, transparent); }
  mark.subj { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 18%, transparent); } mark.pred { border-color: var(--s2); background: color-mix(in srgb, var(--s2) 24%, transparent); font-weight: 600; } mark.obj { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 18%, transparent); }
  mark.snap { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 12%, transparent); } mark.desc { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 20%, transparent); }
  mark.hd0 { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 20%, transparent); } mark.hd1 { border-color: var(--s2); background: color-mix(in srgb, var(--s2) 22%, transparent); } mark.hd2 { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 22%, transparent); } mark.hd3 { border-color: var(--s5); background: color-mix(in srgb, var(--s5) 22%, transparent); } mark.hd4 { border-color: var(--s6); background: color-mix(in srgb, var(--s6) 22%, transparent); }
  mark.enc { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 13px; } dl.kv dt { color: var(--ink-3); white-space: nowrap; } dl.kv dd { margin: 0; }
  .org { font-size: 11px; border-radius: 999px; padding: 0 7px; margin-left: 6px; border: 1px solid var(--line-2); white-space: nowrap; }
  .org.g { background: color-mix(in srgb, var(--s3) 20%, transparent); } .org.d { background: color-mix(in srgb, var(--s1) 18%, transparent); }
  .line { font-size: 13px; margin: 4px 0; color: var(--ink-2); } .line b { color: var(--ink); }
  .pair { display: inline-block; white-space: nowrap; margin-right: 14px; }
  .ok { color: var(--s3); font-weight: 600; white-space: nowrap; } .bad { color: var(--live); font-weight: 600; white-space: nowrap; }
  .frag { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 3px 8px; margin: 3px 0; font-size: 12px; cursor: pointer; }
  .frag.sel { border-color: var(--accent); } .frag i { font-style: normal; color: var(--ink-3); }
  table.lad { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  table.lad th { text-align: left; font: 600 11px var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 3px 6px; border-bottom: 1px solid var(--line-2); }
  table.lad td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .mini { position: relative; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; min-width: 70px; } .mini i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-3); border-radius: 3px; } .mini.enc i { background: var(--accent); } .mini b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--live); }
  .badge { white-space: nowrap; display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; border: 1px solid var(--line-2); }
  .badge.wording { background: color-mix(in srgb, var(--s3) 20%, transparent); } .badge.meaning { background: color-mix(in srgb, var(--s1) 18%, transparent); } .badge.weak { background: color-mix(in srgb, var(--s4) 24%, transparent); }
  .small { font-size: 12px; color: var(--ink-3); } .ng { font-family: var(--mono); font-size: 12px; color: var(--ink-2); } .ng span { white-space: nowrap; margin-right: 10px; display: inline-block; }
  .abr { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 10px; align-items: center; font-size: 13px; margin: 4px 0; white-space: nowrap; }
  .abr .t { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; position: relative; } .abr .t i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; } .abr .t i.g { background: var(--ink-3); } .abr .t span { position: absolute; left: 6px; top: -4px; font: 600 11px var(--mono); }
  .flow { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; } .flow div { flex: 1 1 220px; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; font-size: 13px; } .flow div b { display: block; color: var(--accent); }
  .chipsw { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; } .chipsw span { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 1px 9px; font-size: 12px; white-space: nowrap; } .chipsw span.s { background: color-mix(in srgb, var(--s3) 22%, transparent); } .chipsw span.p { background: color-mix(in srgb, var(--s4) 24%, transparent); } .chipsw span.n { color: var(--ink-3); border-style: dashed; }
  mark.wn_s { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 24%, transparent); } mark.wn_p { border-color: var(--s4); background: color-mix(in srgb, var(--s4) 26%, transparent); } mark.wn_n { border-bottom: 2px dashed var(--ink-3); }
  mark.sf_amount { border-color: var(--s2); background: color-mix(in srgb, var(--s2) 22%, transparent); } mark.sf_date { border-color: var(--s4); background: color-mix(in srgb, var(--s4) 26%, transparent); } mark.sf_name { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 16%, transparent); } mark.sf_triple { border-color: var(--s6); background: color-mix(in srgb, var(--s6) 22%, transparent); font-weight: 600; } mark.sf_un { border-bottom: 2px dashed var(--ink-3); }
  .ev { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 8px; margin-left: 8px; border: 1px solid var(--line-2); white-space: nowrap; font-family: var(--sans); } .ev.chk { background: color-mix(in srgb, var(--s3) 22%, transparent); } .ev.par { background: color-mix(in srgb, var(--s1) 18%, transparent); } .ev.est { background: color-mix(in srgb, var(--s4) 26%, transparent); }
  .key { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; } .key span { margin-right: 14px; white-space: nowrap; }
  .prow { border-top: 1px solid var(--line); padding: 6px 4px; cursor: pointer; border-radius: 6px; } .prow:first-of-type { border-top: 0; } .prow.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .prow .lab { font: 600 11px var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); } .prow .ans { font-size: 14px; font-weight: 600; } .prow .mth { font: 12px/1.45 var(--mono); color: var(--ink-2); margin-top: 2px; } .prow .cav { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  mark.pf_story_type { border-color: var(--s6); background: color-mix(in srgb, var(--s6) 22%, transparent); } mark.pf_topic { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 20%, transparent); } mark.pf_change { border-color: var(--s3); background: color-mix(in srgb, var(--s3) 22%, transparent); } mark.pf_size { border-color: var(--s2); background: color-mix(in srgb, var(--s2) 22%, transparent); } mark.pf_traits { border-color: var(--s5); background: color-mix(in srgb, var(--s5) 22%, transparent); } mark.pf_what_changed { border-color: var(--s4); background: color-mix(in srgb, var(--s4) 26%, transparent); }
  table.sb td { white-space: normal; vertical-align: top; } table.sb td.ng { overflow-wrap: anywhere; } dl.defs { grid-template-columns: max-content 1fr; } dl.defs dt { font-weight: 600; color: var(--ink); } dl.defs dd { margin: 0 0 4px; }
  .prow .src { font: 11px var(--mono); color: var(--ink-3); }
  @keyframes chg { from { background: color-mix(in srgb, var(--accent) 38%, transparent); } to { background: transparent; } } td.chg { animation: chg 2.2s ease-out; }
  .sw3 { display: inline-flex; gap: 6px; margin-left: 12px; vertical-align: middle; } .sw3 button { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; } .sw3 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  td.thisart { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .foot { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
</style>
</head><body><div class="wrap">
<div class="bar"><a class="back" href="../index.html">All mock-ups</a><h1>Reading gates</h1><span class="sp"></span><span class="small" id="built"></span><p style="margin:0 0 8px;font-size:13px"><a href="../state/index.html">Pulse state: the parts by name, what works, what falls short</a></p></div>
<p class="intro" id="intro"></p>
<div class="picker" id="picker" role="group" aria-label="Choose an article"></div>
<p class="key" id="key"></p>
<div class="main">
  <section class="card" aria-label="The article">
    <h2 id="lenstitle"></h2>
    <div class="legend" id="legend"></div>
    <div id="sents"></div>
  </section>
  <div id="gates"></div>
</div>
<section class="card" id="agree"></section>
<section class="card" id="ladder"></section>
<p class="foot" id="foot"></p>
</div>
<script>
(function () {
  "use strict";
  const el = (tag, props, ...kids) => { const n = document.createElement(tag); if (props) for (const k in props) { if (k === "text") n.textContent = props[k]; else if (k === "cls") n.className = props[k]; else if (k === "style") Object.assign(n.style, props[k]); else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]); else n.setAttribute(k, props[k]); } for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c))); return n; };
  const pct = (x) => (100 * x).toFixed(0) + "%";
  const S = { a: 0, layer: "g0", frag: null, head: null, sfk: null, pf: null }; let D = null;
  const CLS = { entity: "name", quantity: "quantity", money: "money", percent: "percent", date: "date", attribution: "who said it", negation: "not / despite", modal: "could / will", change: "change word", event: "event verb", quote: "quotation" };

  fetch("data.json").then((r) => r.json()).then((d) => { D = d; init(); }).catch((e) => { document.getElementById("intro").textContent = "data.json is missing: run projects/world-state/gates_mockup_data.py then gates_v2.py (" + e + ")"; });

  function init() {
    document.getElementById("built").textContent = "computed by " + D.built_by + " and gates_v2.py";
    document.getElementById("intro").textContent = "Three real articles through the gates of playbook 00. Click a card to see what that gate adds, highlighted in the article. Each card shows the contract check it passes and its measured cost.";
    const pk = document.getElementById("picker");
    D.articles.forEach((a, i) => pk.append(el("button", { type: "button", "aria-pressed": String(i === 0), onclick: () => { S.a = i; S.frag = null; S.head = null; draw(); } }, el("span", { cls: "src", text: a.source }), el("span", { cls: "ttl", text: a.title }))));
    const kk = document.getElementById("key"); kk.append(el("b", { text: "What kind of evidence each card shows:  " }), el("span", null, el("span", { cls: "ev chk", text: "checked" }), " verified against the text itself"), el("span", null, el("span", { cls: "ev par", text: "parsed" }), " read by a parser, judged separately against outside gold"), el("span", null, el("span", { cls: "ev est", text: "estimated" }), " a similarity score or a trained model's probability: agreement with Sonnet's labels, not truth"), el("span", null, el("b", { text: "Keys 1, 2, 3 switch article from anywhere on the page." })));
    document.addEventListener("keydown", (e) => { if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const i = ["1", "2", "3"].indexOf(e.key); if (i >= 0 && i < D.articles.length) { S.a = i; S.frag = null; S.head = null; draw(); } });
    document.getElementById("foot").textContent = "Limits: labels behind the ladder and the heads are Sonnet agreement, not outside truth. Heads read the first 600 characters (title plus body). The solver runs on a small spaCy model as a prototype of the playbook's bounded templates. Scan speed is Python regex, far under the playbook's Rust target. Not tuned for production.";
    draw();
  }
  const art = () => D.articles[S.a];
  function draw() { [...document.getElementById("picker").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === S.a))); const a = art(); drawGates(a); drawLens(a); drawAgree(a); drawLadder(a); }

  // ---- lens: paint spans onto the body, per sentence
  function layerSpans(a) {
    const c = a.contract, body = c.body, out = [], legend = []; let hitRanges = [];
    if (S.layer === "g0") {
      out.push({ s: 0, e: Math.min(c.snapshot.length, body.length), cls: "snap", prio: 1 }); legend.push(["snap", "snapshot (first " + c.snapshot.length + " characters)"]);
      const i = body.indexOf(c.description.slice(0, 40)); if (i >= 0) { out.push({ s: i, e: Math.min(i + c.description.length, body.length), cls: "desc", prio: 2 }); legend.push(["desc", "description"]); }
    } else if (S.layer === "scan") {
      a.scan.spots.forEach((x) => out.push({ s: x[0], e: x[1], cls: x[2], prio: 1 })); Object.keys(a.scan.counts).forEach((k) => legend.push([k, CLS[k] || k]));
    } else if (S.layer === "solver") {
      const fr = S.frag !== null ? [a.solver.fragments[S.frag]] : a.solver.fragments;
      fr.forEach((f) => { if (f.subject) out.push({ s: f.subject[0], e: f.subject[1], cls: "subj", prio: 2 }); if (f.object) out.push({ s: f.object[0], e: f.object[1], cls: "obj", prio: 1 }); out.push({ s: f.predicate[0], e: f.predicate[1], cls: "pred", prio: 3 }); if (S.frag !== null) hitRanges.push(f.evidence); });
      legend.push(["subj", "subject"], ["pred", "predicate"], ["obj", "object"]);
    } else if (S.layer === "sparse") {
      const ev = a.observation.evidence.filter((e) => e.words.length); ev.forEach((e, i) => { if (S.head && S.head !== e.head) return; e.words.forEach((w) => w.spans.forEach((sp) => out.push({ s: sp[0], e: sp[1], cls: "hd" + (i % 5), prio: 1 }))); legend.push(["hd" + (i % 5), e.head + "  ←  " + e.words.map((w) => w.word).join(", ")]); });
    } else if (S.layer === "encoder") {
      a.observation.conditions.filter((k) => k.encoder_status === "yes").forEach((k) => { const q = a.kinds.find((z) => z.kind === k.kind); if (q) { hitRanges.push(q.encoder_evidence); legend.push(["enc", k.kind + " (best sentence)"]); } });
    } else if (S.layer === "pulse") {
      const PL = { story_type: "story type", topic: "topic", what_changed: "what changed", change: "change and direction", size: "size", traits: "traits" };
      Object.keys(PL).forEach((k) => { if (S.pf && S.pf !== k) return; a.pulse[k].evidence.forEach((e) => out.push({ s: e.s, e: e.e, cls: "pf_" + k, prio: 1 })); legend.push(["pf_" + k, PL[k]]); });
    } else if (S.layer === "stated") {
      const kinds = S.sfk ? [S.sfk] : ["amount", "date"]; a.stated_facts.facts.filter((f) => kinds.includes(f.kind)).forEach((f) => out.push({ s: f.s, e: f.e, cls: f.status === "stated" ? "sf_" + f.kind : "sf_un", prio: f.kind === "triple" ? 3 : 2 }));
      kinds.forEach((k) => legend.push(["sf_" + k, k === "triple" ? "predicate of a triple (stated)" : k + " (stated)"])); legend.push(["sf_un", "unbound: no clear binding, left unknown"]);
    } else if (S.layer === "wide") {
      const w = a.wide_net; w.items.filter((o) => o.type === "keyphrase").forEach((o) => { const cl = o.strict ? "wn_s" : o.mapped ? "wn_p" : "wn_n"; findAll(body, o.phrase).forEach((r) => out.push({ s: r[0], e: r[1], cls: cl, prio: 2 })); });
      w.entities.forEach((n) => findAll(body, n).forEach((r) => out.push({ s: r[0], e: r[1], cls: "entity", prio: 1 }))); legend.push(["wn_s", "strong match"], ["wn_p", "possible match"], ["wn_n", "matched nothing: new"], ["entity", "name"]);
    } else if (S.layer === "density") { legend.push(["hd0", "darker sentence = closer in meaning to the title"]); }
    return { out, legend, hitRanges };
  }
  const findAll = (body, ph) => { const out = []; const re = new RegExp("\\b" + ph.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+") + "\\b", "gi"); let m; while ((m = re.exec(body))) out.push([m.index, m.index + m[0].length]); return out; };
  const LAYER_NAME = { pulse: "Pulse evidence: the exact words each answer rests on", stated: "Stated facts: spans that pass the validator (dashed = unbound)", wide: "Wide net: open phrases, coloured by what they matched", g0: "G0 record: where the snapshot and description sit in the body", scan: "G1 spot map", solver: "G2 fragments", density: "Lens linkage: each sentence shaded by its closeness to the title", sparse: "G3a evidence words, with the head that they carried", encoder: "G3b best sentences for heads the encoder answered" };
  function drawLens(a) {
    document.getElementById("lenstitle").textContent = LAYER_NAME[S.layer];
    const { out, legend, hitRanges } = layerSpans(a), body = a.contract.body, cls = new Array(body.length).fill(null), pr = new Array(body.length).fill(-1);
    out.forEach((sp) => { for (let i = sp.s; i < sp.e && i < body.length; i++) if (sp.prio > pr[i]) { pr[i] = sp.prio; cls[i] = sp.cls; } });
    const lg = document.getElementById("legend"); lg.replaceChildren(); const seen = new Set(); legend.forEach(([c, n]) => { if (seen.has(c + n)) return; seen.add(c + n); lg.append(el("mark", { cls: c, text: n })); });
    if (S.layer === "sparse" && !legend.length) lg.append(el("span", { cls: "small", text: "no head answered with evidence words for this article" }));
    if (S.layer === "encoder" && !hitRanges.length) lg.append(el("span", { cls: "small", text: "no head was answered by the encoder for this article" }));
    const box = document.getElementById("sents"); box.replaceChildren();
    a.sentences.forEach((s, n) => {
      const p = el("p", { cls: "sent" }); p.append(el("span", { cls: "n", text: String(n + 1) }));
      if (hitRanges.some((r) => s.start < r[1] && s.end > r[0])) p.classList.add("hit");
      if (S.layer === "density") { const v = a.lens.sentence_sims[n]; p.style.background = "color-mix(in srgb, var(--accent) " + Math.round(Math.max(0, v) * 70) + "%, transparent)"; p.append(el("span", { cls: "small", text: "  " + v.toFixed(2) })); }
      let i = s.start; while (i < s.end) { let j = i; while (j < s.end && cls[j] === cls[i]) j++; const t = body.slice(i, j); p.append(cls[i] ? el("mark", { cls: cls[i] }, t) : t); i = j; }
      box.append(p);
    });
  }

  // ---- gate cards
