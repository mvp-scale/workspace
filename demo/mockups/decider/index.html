<!doctype html>

</style></head><body>
<main style="max-width:1100px;margin:0 auto;padding:12px 16px 40px">
<h1 style="margin:0 0 2px;font-size:20px">Watch the topic reader and the decider work on one article</h1><p style="margin:0 0 8px;font-size:13px"><a href="../state/index.html">Pulse state: the parts by name, what works, what falls short</a></p>
<p class="intro" style="margin:0 0 6px">Each of the 120 items is a headline and the opening of a news story, labelled with a topic by people. Pick one and follow it from the words to the decision.</p>
<div class="ctl" id="ctl"></div>
<div id="out"></div>
