<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit C</title><link rel="stylesheet" href="../mock.css"><link rel="stylesheet" href="cockpit.css">
<style>.stage{grid-template-columns:minmax(0,1.3fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr) clamp(130px,17vh,220px);grid-template-areas:"top top" "conv rail" "chart chart"}
 .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;flex:1 1 0;min-height:170px} .pad{padding:10px 14px 14px;overflow:auto}
 @media (max-width:1000px){.cols{grid-template-columns:1fr}}</style></head>
<body><div class="app">
<header class="hd"><a class="back" href="index.html">&larr; Variants</a><h1>Cockpit C</h1><span id="pick"></span><span id="banner"></span><span class="sp"></span><span class="pill mp" id="modelpill" title="Model, typical lag, window per person"></span><canvas class="wave" id="wave"></canvas><span id="pill"></span><span id="ctl"></span></header>
<div id="wbar"></div>
<main class="stage" id="stage" data-tab="talk">
  <section class="panel pane" data-pane="signals" style="grid-area:top">
    <div class="lane them"><div><div class="side">THEM</div><div class="who" id="who-them"></div></div><div class="strip" id="lane-them"></div></div>
    <div class="lane you"><div><div class="side">US</div><div class="who" id="who-us"></div></div><div class="strip" id="lane-us"></div></div>
  </section>
  <section class="panel pane fill" data-pane="talk" style="grid-area:conv"><header><h2>Conversation</h2></header><div class="chat grow"><div class="glide" id="view"><div class="track" id="track"></div></div></div><div class="readnote" id="readnote"></div></section>
  <div class="pane rail" data-pane="cues" style="grid-area:rail">
    <div class="cols">
      <section class="panel fill"><header><h2>Cue cards</h2><span class="r" id="more"></span></header><div class="grow" style="padding:10px 14px 14px"><div id="moms"></div></div></section>
      <section class="panel fill"><header><h2>Coaching</h2></header><div class="pad"><div id="balance"></div><div class="bt" style="margin-top:12px">Key points <span class="cprog" id="cprog"></span></div><div id="checklist"></div></div></section>
    </div>
    <section class="panel fill" style="flex:0 0 clamp(150px,19vh,250px)"><header><h2>Captured so far</h2></header><div style="padding:10px 14px 0" id="model"></div><div class="grow" style="padding:8px 14px 12px"><div class="facts" id="facts"></div><div class="fmore" id="fmore"></div></div></section>
  </div>
  <section class="panel pane fill" data-pane="history" style="grid-area:chart"><header><h2>Last 60 seconds</h2><span class="key"><span><i></i>Them</span><span><i class="d"></i>Us</span></span></header><div class="chart" id="ch"><canvas></canvas></div></section>
</main>
<nav class="tabs" id="tabs" aria-label="Sections"><button data-t="talk" aria-selected="true">Talk</button><button data-t="signals" aria-selected="false">Signals</button><button data-t="cues" aria-selected="false">Cues</button><button data-t="history" aria-selected="false">History</button></nav>
</div>
<script src="../apollo.js"></script><script src="../data.js"></script><script src="data2.js"></script><script src="../mock.js"></script><script src="cockpit.js"></script>
<script>Cockpit.boot({ codes: false, modelMode: "chips" });</script></body></html>
