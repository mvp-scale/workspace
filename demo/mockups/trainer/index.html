<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainer live</title>
<link rel="stylesheet" href="/static/app.css">

  .ev { border-top: 1px solid var(--border); padding: 5px 0; }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }

  @media (max-width: 900px) { body { overflow: auto; display: block; } .app { height: auto; } .body, .ov { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
