<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation flow · Jev Bench Console</title>
<meta name="description" content="A real transcript replayed word by word through the loaded models. Detectors have a colour and an icon; each person's own window is scored, and person cards show which detectors they hit. Signals rise, hold and fade, with a heat-strip history and the exact request sent to the model.">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
<script src="/static/voice-source.js"></script>
<style>
  /* Layout the shared CSS lacks. Colours come from shared tokens only (detector colours are --s1 to --s8; icons tell detectors apart beyond that). */
  [hidden] { display: none !important; }
  .footer { display: none; }
  .page.cockpit { max-width: none; padding: 8px var(--gutter) 10px; }
  .cp { display: flex; flex-direction: column; gap: 8px; height: calc(100dvh - 42px - 18px); min-height: 800px; }
  .cp .top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-end; }
  .cp .top h1 { font-size: 17px; }
  .cp .sub { color: var(--text-3); font-size: 12px; }
  @media (max-width: 1700px) { .cp .top .sub { display: none; } }
  .cp .ctl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-end; margin-left: auto; }
  .cp .field select { min-width: 120px; max-width: 230px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font: 500 12px var(--mono); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); min-height: 30px; }
  .pill .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .pill.on .rec { background: var(--bad); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.8); } }
  .notice { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); cursor: pointer; }

  .pn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pn > header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 12px 0; min-height: 26px; position: relative; }
  .pn > header .r { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .pn > .bd { padding: 6px 12px 10px; flex: 1; min-height: 0; display: flex; min-width: 0; position: relative; }
  .pn > .bd > * { flex: 1; min-width: 0; }

  /* Detectors and people */
  .stage { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr) clamp(146px, 17vh, 220px); grid-template-areas: "top top" "conv rail" "chart chart"; }
  .toppn { padding: 6px 12px 8px; display: grid; gap: 6px; grid-area: top; }
  .trow { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .trow h4 { padding-top: 6px; }
  .dets { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; max-height: 76px; overflow: auto; min-height: 30px; }
  .dchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); position: relative; }
  .dchip.custom { border-style: dashed; }
  .dchip .ic { color: var(--c); display: grid; place-items: center; }
  .dchip .nm { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .dchip .mt { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--surface-2); border-radius: 0 0 5px 5px; overflow: hidden; }
  .dchip .mt i { display: block; height: 100%; background: var(--c); transform-origin: left; transform: scaleX(0); }
  .dchip .x { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); cursor: pointer; padding: 0; font-size: 12px; line-height: 1; width: 16px; height: 16px; border-radius: 50%; position: absolute; right: -6px; top: -7px; opacity: 0; z-index: 2; display: grid; place-items: center; }
  .dchip:hover .x, .dchip .x:focus-visible { opacity: 1; } .dchip .x:hover { color: var(--bad); border-color: var(--bad); }
  .dchip.hot { background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-color: var(--c); }
  .dchip.quiet .nm { color: var(--text-2); font-weight: 500; } .dchip.quiet .ic { opacity: .75; }
  .people { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-height: 52px; }
  .pcard { flex: 0 0 auto; width: 206px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px 4px; background: var(--surface-2); }
  .pcard.speaking { border-color: var(--accent); background: var(--accent-soft); }
  .pcard .h1 { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .pnum { min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; background: color-mix(in srgb, var(--v, var(--text-2)) 30%, var(--surface)); border: 1px solid var(--v, var(--text-2)); color: var(--text); font: 700 10.5px var(--mono); display: grid; place-items: center; flex: none; }
  .pcard .rt { font: 500 10px var(--mono); color: var(--accent); margin-left: auto; }
  .pcard b { font-size: 12px; font-weight: 650; }
  .hits { display: flex; gap: 3px; flex-wrap: wrap; min-height: 20px; }
  .hit { display: inline-flex; align-items: center; gap: 3px; padding: 1px 4px; border-radius: 4px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .hit svg { color: var(--c); } .hit .t { font: 500 10px var(--mono); color: var(--text-2); }
  .hit.cool { opacity: .5; }
  .nohit { font-size: 11px; color: var(--text-3); }

  .glide { position: relative; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 100%); }
  .glide > .track { will-change: transform; padding-top: 8px; }
  .msg { display: flex; margin: 5px 0; --v: var(--text-2); } .msg.coach { justify-content: flex-end; }
  .bub { max-width: min(88%, 680px); padding: 4px 10px 6px; border-radius: 12px 12px 12px 4px; background: color-mix(in srgb, var(--v) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--v) 30%, var(--border)); font-size: clamp(14px, 0.4vw + 11px, 17px); line-height: 1.55; }
  .msg.coach .bub { border-radius: 12px 12px 4px 12px; }
  .meta { display: flex; align-items: center; gap: 6px; font: 500 10.5px var(--mono); color: var(--text-3); line-height: 1.6; } .meta .pnum { height: 15px; min-width: 20px; font-size: 10px; }
  .meta .nmx { font-family: var(--font); font-weight: 600; letter-spacing: .02em; color: var(--text-2); }
  .txt { position: relative; } .txt .ghost { visibility: hidden; user-select: none; padding-right: 8px; } .txt .words { position: absolute; left: 0; top: 0; width: 100%; }
  .w { display: inline-block; animation: wordin .26s ease-out both; } @keyframes wordin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .showwin .w.out { color: var(--text-3); }
  .caret { display: inline-block; width: 0; height: 1.05em; position: relative; vertical-align: text-bottom; } .caret::after { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px; background: var(--accent); animation: caret 1s steps(2) infinite; } @keyframes caret { 50% { opacity: 0; } }
  .ph { box-shadow: inset 0 -2px 0 var(--c); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .readnote { font-size: 11px; color: var(--text-3); padding: 0 12px 6px; }

  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; flex: 1 1 0; min-height: 210px; }
  .stackroot { position: relative; overflow: hidden; }
  .moment { border: 1px solid var(--border-strong); border-left: 4px solid var(--c); border-radius: var(--radius-sm); padding: 0 6px 0 8px; background: var(--surface); height: 34px; overflow: hidden; display: flex; align-items: center; gap: 7px; }
  .moment.cool { background: var(--surface-2); border-color: var(--border); border-left-color: var(--c); }
  .moment .ic { color: var(--c); display: grid; place-items: center; flex: none; }
  .moment .nm { font-weight: 650; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .moment .who { font: 700 11px var(--mono); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 0 6px; flex: none; }
  .moment .pc { font: 600 11px var(--mono); color: var(--text); flex: none; }
  .moment .cnt { font: 500 10.5px var(--mono); color: var(--text-3); flex: none; }
  .moment .age { margin-left: auto; font: 500 10.5px var(--mono); color: var(--text-3); white-space: nowrap; flex: none; }
  .moment .btn { font-size: 11px; padding: 0 4px; line-height: 16px; min-height: 0; flex: none; }
  .moment.cool .nm { color: var(--text-2); font-weight: 500; }
  .moment .hold { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--border); } .moment .hold i { display: block; height: 100%; background: var(--c); transform-origin: left; }
  .scroll { overflow: auto; min-height: 0; }
  .cnote { border-left: 5px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 4px; }
  .cnote.caution { border-left-color: var(--bad); background: var(--bad-soft); } .cnote.notice { border-left-color: var(--warn); background: var(--warn-soft); }
  .cwin { display: flex; justify-content: space-between; font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
  .chead { font-size: clamp(22px, 1.9vw, 28px); font-weight: 780; letter-spacing: -.02em; line-height: 1.05; }
  .ctext { font-size: 14px; line-height: 1.3; font-weight: 500; }
  .cwhy { font-size: 12px; color: var(--text-2); min-height: 16px; }
  .ctimer .trk { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 14%, transparent); overflow: hidden; } .ctimer .trk i { display: block; height: 100%; background: var(--text); transform-origin: left; }
  .bt { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 2px 0 4px; }
  .split { position: relative; height: 9px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .split i { position: absolute; top: 0; bottom: 0; width: 100%; } .split .th { left: 0; background: var(--text-3); transform-origin: left; transform: scaleX(.5); } .split .me { right: 0; background: var(--accent); transform-origin: right; transform: scaleX(.5); }
  .bl { font: 500 11px var(--mono); color: var(--text-2); margin: 4px 0 6px; min-height: 14px; } .tip { font-size: 12.5px; min-height: 18px; }
  .ck { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: center; }
  .ck .g { font: 700 12px var(--mono); color: var(--text-3); } .ck.done .g { color: var(--good); } .ck .ts { font: 500 10.5px var(--mono); color: var(--text-3); }
  .ck button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
  .rf { font-size: 12px; color: var(--text-2); padding: 2px 0; overflow-wrap: anywhere; }

  /* Tabbed card */
  .tabs2 { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 8px; flex-wrap: wrap; }
  .tabs2 button { border: 0; background: transparent; padding: 6px 9px; font: inherit; font-size: 12.5px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs2 button[aria-selected=true] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .tabpane { padding: 6px 12px 8px; overflow: auto; flex: 1; min-height: 0; }
  .mrow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 6px; }
  .mrow .l { font-size: 12px; color: var(--text-3); } .mrow .segmented button { padding: 3px 8px; }
  .mbtn { display: inline-flex; gap: 6px; align-items: baseline; } .mbtn small { font: 500 10.5px var(--mono); color: var(--text-3); }
  .est { font: 500 11px var(--mono); color: var(--text-2); }
  .li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; } .li .ts { font: 500 11px var(--mono); color: var(--text-3); }
  .li .q { color: var(--text-2); overflow-wrap: anywhere; } .li .ic { display: inline-block; vertical-align: -2px; margin-right: 4px; color: var(--c); }
  .dform { display: grid; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .dform label { font-size: 12px; font-weight: 500; color: var(--text-2); display: grid; gap: 2px; }
  .icons { display: flex; flex-wrap: wrap; gap: 4px; }
  .icons button { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 5px; padding: 3px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
  .icons button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chartwrap { position: relative; flex: 1; min-height: 0; padding: 2px 10px 6px; } .chartwrap canvas { position: absolute; inset: 2px 10px 6px; width: calc(100% - 20px); height: calc(100% - 8px); }
  .key { font-size: 12px; color: var(--text-2); }
  .tabsbar { display: none; }
  @media (max-width: 1100px) {
    .cp { min-height: 0; }
    .cp .ctl { margin-left: 0; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "x"; }
    .stage > [data-pane] { grid-area: x; display: none; }
    .stage[data-tab="talk"] > [data-pane="talk"], .stage[data-tab="signals"] > [data-pane="signals"], .stage[data-tab="cues"] > [data-pane="cues"], .stage[data-tab="history"] > [data-pane="history"] { display: flex; flex-direction: column; }
    .stage[data-tab="signals"] > [data-pane="signals"] { display: grid; align-content: start; overflow: auto; }
    .stage[data-tab="cues"] > [data-pane="cues"] { overflow: auto; }
    .dets { max-height: none; }
    .cols { grid-template-columns: 1fr; flex: 0 0 auto; }
    .tabsbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: var(--surface); }
    .tabsbar button { border: 0; background: transparent; padding: 10px 4px; font: inherit; font-size: 12px; color: var(--text-3); border-top: 2px solid transparent; cursor: pointer; }
    .tabsbar button[aria-selected=true] { color: var(--text); border-top-color: var(--text); font-weight: 600; }
  }
  @media (max-width: 560px) { .trow { grid-template-columns: 1fr; } .bub { max-width: 92%; } .cp .top .sub { display: none; } }
  @media (prefers-reduced-motion: reduce) { .w, .caret::after, .pill.on .rec { animation: none; } }

  /* Tab panes: one job each */
  .tabs2 button .n { margin-left: 5px; font: 500 10.5px var(--mono); color: var(--text-3); } .tabs2 button[aria-selected=true] .n { color: var(--text-2); }
  .tabpane.col { display: flex; flex-direction: column; gap: 6px; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; }
  .fl { border-left: 4px solid var(--c); padding: 4px 8px 5px; margin: 4px 0; background: var(--surface); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: var(--radius-sm); }
  .fl .ts, .evx .ts { font: 500 11px var(--mono); color: var(--text-3); padding-top: 1px; }
  .fl .fh { display: flex; align-items: center; gap: 7px; font-size: 12.5px; } .fl .ic { color: var(--c); display: grid; place-items: center; }
  .fl .vc, .fl .cnt { font: 600 10.5px var(--mono); color: var(--text-2); } .fl .vc { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 0 6px; } .fl .pc { font: 600 11px var(--mono); margin-left: auto; } .fl .ts { font: 500 10.5px var(--mono); color: var(--text-3); }
  .fl .q { color: var(--text-2); font-size: 12.5px; overflow-wrap: anywhere; }
  .drow { display: grid; grid-template-columns: 22px auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; } .drow .ic { color: var(--c); display: grid; place-items: center; } .drow .small { text-align: right; }
  .libchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .libchip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; padding: 4px 9px; border: 1px dashed var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text-2); cursor: pointer; } .libchip:hover { border-style: solid; color: var(--text); background: var(--surface-2); }
  .dnew { margin-top: 10px; } .dnew > summary { cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--accent); }
  .frow { display: flex; gap: 14px; flex-wrap: wrap; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .mbig { display: inline-flex; align-items: baseline; gap: 6px; font: inherit; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; } .mbig b { font: 700 13px var(--mono); } .mbig small { font: 500 10.5px var(--mono); color: var(--text-3); } .mbig small.paid { color: var(--warn); }
  .mbig[aria-checked=true] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .mstat { display: flex; align-items: center; gap: 4px; min-height: 18px; margin-bottom: 4px; }
  .twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
  .bigval { font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; } .bigslider { width: 100%; min-height: 24px; margin: 2px 0; }
  .help { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .reqbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .reqhead { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
  pre.req { flex: 1; min-height: 60px; overflow: auto; margin: 0; }
  .evx { padding: 6px 0; border-bottom: 1px solid var(--border); } .evx .eh { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; font-size: 13px; }
  .evx .er { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 0 48px; } .evx .lbl { font-size: 11px; color: var(--text-3); }
  .drow button.x { border: 0; background: transparent; color: var(--text-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; } .drow button.x:hover { color: var(--bad); }
  .moment .sup { display: inline-flex; align-items: center; gap: 2px; font: 600 11px var(--mono); color: var(--text-3); flex: none; }
  .moment.shifted { opacity: .7; }

  /* ---- live additions (from the Flow lab) ---- */
  .mockbanner { font-size: 12px; color: var(--text-2); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: 3px 10px; align-self: center; }
  .livepanel { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-end; }
  .livepanel input[type=text] { min-width: 280px; }
  .tent { font-style: italic; color: var(--text-3); font-size: 13px; padding: 4px 12px 6px; border-top: 1px dashed var(--border); min-height: 26px; }
  .tent .pnum { margin-right: 6px; font-style: normal; display: inline-grid; }
  .pcard .vstat { font: 500 10.5px var(--mono); color: var(--text-3); min-height: 14px; } .pcard.stale { opacity: .6; } .pcard .vstat.ret { color: var(--warn); font-weight: 600; }
  .vcap { font: 600 11px var(--mono); padding-top: 6px; white-space: nowrap; } .vcap.warn { color: var(--warn); } .vcap.bad { color: var(--bad); }
  .liveerr { font-size: 12px; color: var(--bad); background: var(--surface); border: 1px solid var(--bad); border-radius: var(--radius-sm); padding: 4px 10px; }
  /* one stable header + one fixed-height source bar: both modes occupy the same space, so switching never re-flows the page */
  .cp .hdr { display: flex; align-items: center; gap: 10px 14px; min-height: 40px; }
  .hdr .hl { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; } .hdr .hr { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }
  .hdr h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  .srcbar { display: grid; min-height: 60px; align-items: end; }
  .srcbar > .layer, .srcbar > .livepanel { grid-area: 1 / 1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-end; align-content: flex-end; min-width: 0; transition: opacity .18s ease; }
  .srcbar .off { opacity: 0; visibility: hidden; pointer-events: none; }
  .srcbar textarea { height: 34px; min-height: 34px; resize: none; }
  .slot { min-width: 340px; display: flex; flex-direction: column; }
  .inlinenote { position: relative; font-size: 12px; color: var(--text-2); }
