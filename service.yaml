# service.yaml -- the one place that says what can run here and what is "on".
# Used by ./service.sh (tools/service.py). Edit this file, then:  ./service.sh check   to validate it.
#
# SERVICES say how a thing runs. PROFILES say which things are on.
#   ./service.sh up                 -> the ideal state: the baseline profile up and healthy (on-demand services left as they are)
#   ./service.sh reset              -> restart the baseline cleanly;   ./service.sh down  -> stop everything
#   ./service.sh start              -> starts default_profile
#   ./service.sh start full         -> a profile name
#   ./service.sh restart tag:gpu    -> every service with that tag (tags are free labels)
#   ./service.sh restart world      -> one service
#
# Service keys
#   kind        proc (we launch and track it) | systemd (delegated to systemctl) | script (a script with start|stop|status)
#   desc        one line shown in status
#   port        the port it listens on (used for health and to find an untracked process)
#   cmd         argv list; ${port} and ${root} are substituted (proc)
#   cwd         working dir, relative to /workspace (proc)
#   env         extra environment; ${port} substituted. env_file: a dotenv file loaded first (secrets stay in .env)
#   path_prepend  directories put first on PATH (proc)
#   unit        systemd unit name (default: the service name); blocking: true waits for start to finish
#   script      path of the script (script kind)
#   match       regex the process command line must match before we will stop it (safety)
#   health      HTTP path that must answer (any status below 500) for the service to count as up
#   boot        seconds to wait for health after a start
#   after       services that must start before this one (stop runs in reverse)
#   heavy       true = stop/restart asks first (loaded state or slow reload is lost)
#   flex        true = may run on another port (a profile entry or --port)
#   tags        free labels, used as  tag:<label>  (tag demand = a switch in the console's top-bar Services panel)
#   label       panel name when the service is not a registered model (models show their registry name, matched by port)
#   panel       short note shown beside it in the Services panel (memory it takes)
#   stop / restart   optional shell command overrides (default: signal the process / stop then start)
#   log         log file (default logs/<name>.log)

default_profile: baseline

# One browser port: the console (:8100) serves every page (mock-ups at /mockups/) and relays to the services behind it,
# voice included (/voice/ws). The other ports are internal. Services tagged `demand` are switched on when needed, from
# here or from the console's top bar (local visitors only).
# Profile entries: a service name, another profile name, or a mapping {service: name, port: N, env: {K: V}}
profiles:
  baseline: [world, demo, voice, classifier, clef-flash-q4km]   # the default: World Engine, console, voice, CPU classifier, Clef Q4
  models: [kev-4b, semif, so1]                     # old decision models: off by default, never at boot (laya and verdict are retired: startable by name only)
  full:   [baseline, models]
  share:  [share]                                   # a public Cloudflare link for the console (no login: anyone with it can spend the TypeSafe key)
  test-world:                                       # a second engine beside the live one, for testing
    - {service: world, port: 8122}
  world-v1:                                         # the live engine on the original, smaller ontology (restart world-v1 to switch; restart world to go back to v2)
    - {service: world, env: {WE_RULES: rules}}

services:
  winnow:
    kind: proc
    desc: "Winnow-12B (llama.cpp): a TypeSafe model, one of the World Engine's possible readers (about 15 GB GPU)"
    panel: about 15 GB GPU
    port: 8091
    cwd: models/winnow-inference
    env: {CUDA_VISIBLE_DEVICES: "0"}
    path_prepend: [/usr/local/cuda/bin]
    cmd:
      - models/winnow-inference/.build/bin/winnow-server
      - --model
      - models/Winnow-12B/gguf/Winnow-12B-Q8_0.gguf
      - --alias
      - Winnow-12B
      - --ctx-size
      - "65536"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "999"
      - --fit
      - "off"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --no-context-shift
      - --lazy-mode
      - "off"
      - --split-mode
      - none
      - --override-tensor
      - '^(token_embd|per_layer_token_embd)\.weight$=CUDA0'
      - --batch-size
      - "2048"
      - --ubatch-size
      - "1024"
      - --threads
      - "8"
      - --host
      - 127.0.0.1
      - --port
      - ${port}
      - --jinja
      - --reasoning
      - "off"
      - --no-warmup
      - --cache-ram
      - "0"
      - --cors-origins
      - ""
      - --mmproj
      - models/Winnow-12B/gguf/mmproj-Winnow-12B.gguf
    match: winnow-server
    health: /health
    boot: 180
    heavy: true
    flex: true
    tags: [gpu, model]
    log: logs/winnow.log

  world:
    kind: proc
    desc: World Engine 2 service (people, places, impact)
    port: 8112
    cwd: probes/world-engine
    cmd: [/workspace/kev/.venv/bin/python, world_service2.py]
    env: {WE2_PORT: "${port}", WE_RULES: rules_v2}   # expanded ontology (49 topics, 20 decisions); the world-v1 profile goes back to v1
    match: world_service2\.py
    health: /live?since=0
    boot: 120
    heavy: true
    flex: true
    tags: [gpu, engine, baseline]
    log: logs/world2.log

  demo:
    kind: proc
    desc: "Console: leaderboard, flow, World Engine pages"
    port: 8100
    cmd: [python3, demo/server.py]
    env_file: .env
    env: {DEMO_PORT: "${port}"}        # set WORLD_ENGINE_URL in your shell to aim a demo at a test engine
    match: demo/server\.py
    health: /api/status
    boot: 30
    after: [world]
    flex: true
    tags: [web, baseline]
    log: logs/demo.log

  voice:
    kind: proc
    desc: Live speaker-attributed transcription (browser reaches it through the console at /voice/ws)
    label: Voice
    panel: about 4 GB GPU
    port: 8200
    cwd: voice
    cmd: [.venv/bin/python, server.py]
    match: 'server\.py'
    health: /api/status
    boot: 90
    tags: [gpu, voice, demand]
    log: logs/voice.log

  classifier:
    kind: proc
    desc: "BitMob, the local CPU classifier (e5-small int8 + one learned head per question, TypeSafe /v1/systemone, no GPU)"
    panel: CPU only, no GPU
    port: 8020
    cmd: [models/embed-zs/.venv/bin/python, probes/cpu_engine.py]
    env: {CPU_ENGINE_PORT: "${port}", HF_HOME: "${root}/data/hf", CUDA_VISIBLE_DEVICES: ""}
    match: cpu_engine\.py
    health: /health
    boot: 120                                       # about 20 s with cached vectors; the first start on a new runtime encodes the corpus (about 40 s)
    after: [clef-flash-q4km]                        # Clef is its optional backup (?backup=1)
    tags: [cpu, model, demand]
    log: logs/cpu-engine.log

  bitmob-reader:
    kind: proc
    desc: "BitMob as a World-engine reader (D-0037): fine-tuned CPU readers answer the engine's gate, type, scope, condition, topic and country questions; local Clef answers only expected impact and severity (or nothing, in the CPU-only mode)"
    panel: CPU only, no GPU
    port: 8021
    cmd: [models/embed-zs/.venv/bin/python, newsreader/bitmob/reader/engine_reader.py]
    env: {BITMOB_READER_PORT: "${port}", THREADS: "8", HF_HOME: "${root}/data/hf", CUDA_VISIBLE_DEVICES: ""}
    match: engine_reader\.py
    health: /health
    boot: 120
    tags: [cpu, model, demand]
    log: logs/bitmob-reader.log

  newsreader:
    kind: proc
    desc: "News reader: polls the curated feeds (newsreader/catalogue.csv), fetches and extracts articles to Markdown, queues them for the World engine"
    panel: CPU and network only
    port: 8140
    cwd: newsreader
    cmd: ["${root}/newsreader/.venv/bin/python", -m, nr.serve]
    env: {NR_PORT: "${port}", NR_DB: "${root}/data/newsreader/queue.sqlite"}
    match: nr\.serve
    health: /health
    boot: 30
    tags: [news, demand]
    label: News reader
    log: logs/newsreader.log

  kev-4b:
    kind: systemd
    desc: kev-4b decision model (starts first; needs about 17 GiB while loading)
    port: 8010
    blocking: true
    match: serve_kev
    health: /v1/models
    boot: 240
    heavy: true
    tags: [gpu, model]

  semif:
    kind: systemd
    desc: SemIf model
    port: 8012
    after: [kev-4b]
    match: serve_inproc
    health: /
    boot: 300
    heavy: true
    tags: [gpu, model]

  so1:
    kind: systemd
    desc: Open-alternative Jev model
    port: 8013
    after: [kev-4b]
    match: serve_inproc
    health: /
    boot: 300
    heavy: true
    tags: [gpu, model]

  laya:
    kind: systemd
    desc: Laya model
    port: 8014
    after: [kev-4b]
    match: serve_inproc
    health: /
    boot: 300
    heavy: true
    tags: [gpu, model]

  verdict:
    kind: systemd
    desc: Verdict model (CPU)
    port: 8015
    after: [kev-4b]
    match: serve_inproc
    health: /
    boot: 300
    heavy: true
    tags: [cpu, model]

  clef-flash:
    kind: systemd
    desc: Clef Flash (Cloudflare, 9B bf16; about 19 GiB, so it runs alone, not in the models profile)
    port: 8017
    match: serve_inproc
    health: /healthz
    boot: 300
    heavy: true
    tags: [gpu, model, solo]

  clef-flash-nvfp4:
    kind: systemd
    desc: Clef Flash Fast (alpha-x-ai NVFP4/FP8, unofficial, vLLM 0.30.0 in-process via serve_inproc; Blackwell only; the card's backbone is 7.6 GiB, plan about 16 GiB with CLEF_KV_GIB=4, so it runs beside Clef Q4 only when that much is free, never in a profile)
    panel: about 16 GB GPU (to be measured)
    port: 8038
    match: --model clef-flash-nvfp4
    health: /healthz
    boot: 300
    heavy: true
    tags: [gpu, model, solo]

  clef-flash-q4km:
    kind: proc
    desc: Clef Flash Q4_K_M (bartowski GGUF, llama.cpp b11430, native /v1/systemone, text and images; about 10-11 GiB)
    panel: about 11 GB GPU
    port: 8018
    cmd:
      - models/llama-cpp-b11430/llama-b11430/clef-flash-q4km
      - -m
      - data/models/clef-flash-q4km/Cloudflare_clef-flash-Q4_K_M.gguf
      - --alias
      - clef-flash-q4km
      - --host
      - 127.0.0.1
      - --port
      - ${port}
      - -ngl
      - "999"
      - -c
      - "131072"
      - -np
      - "8"
      - -b
      - "16384"
      - -ub
      - "16384"
      - --mmproj
      - data/models/clef-flash-q4km/mmproj-Cloudflare_clef-flash-f16.gguf
    env: {LD_LIBRARY_PATH: "/workspace/models/llama-cpp-b11430/llama-b11430:/workspace/models/llama-cpp-b11430/cudart-llama-b11430-bin-ubuntu-cuda-12.8-x64"}
    match: --alias clef-flash-q4km
    health: /health
    boot: 120
    flex: true
    tags: [gpu, model, demand]
    log: logs/clef-flash-q4km.log

  clef-flash-q2k:
    kind: proc
    desc: Clef Flash Q2_K (bartowski GGUF, about 3.7 bits per weight, llama.cpp b11430, text and images; about 9 GiB)
    port: 8019
    cmd:
      - models/llama-cpp-b11430/llama-b11430/clef-flash-q2k
      - -m
      - data/models/clef-flash-q2k/Cloudflare_clef-flash-Q2_K.gguf
      - --alias
      - clef-flash-q2k
      - --host
      - 127.0.0.1
      - --port
      - ${port}
      - -ngl
      - "999"
      - -c
      - "131072"
      - -np
      - "8"
      - -b
      - "16384"
      - -ub
      - "16384"
      - --mmproj
      - data/models/clef-flash-q2k/mmproj-Cloudflare_clef-flash-f16.gguf
    env: {LD_LIBRARY_PATH: "/workspace/models/llama-cpp-b11430/llama-b11430:/workspace/models/llama-cpp-b11430/cudart-llama-b11430-bin-ubuntu-cuda-12.8-x64"}
    match: --alias clef-flash-q2k
    health: /health
    boot: 120
    flex: true
    tags: [gpu, model]
    log: logs/clef-flash-q2k.log

  share:
    kind: script
    desc: Cloudflare quick tunnel for the console (a public link; voice goes through it too)
    script: ./cf_start.sh
    after: [demo]
    tags: [public]
