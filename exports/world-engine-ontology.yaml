      family_change: +0.5
      donate_volunteer: +0.5
  prosociality:
    name: Prosociality (willingness to help others)
    drives:
      donate_volunteer: +0.8
  environmental_values:
    name: Environmental values
    drives:
      travel: -0.2
  health_orientation:
    name: Health orientation
    drives:
      health_action: +0.8
  financial_literacy:
    name: Financial literacy
    drives:
      invest: +0.5
  financial_stress:
