      news_attention: +0.5
    level_of: state_capacity        # higher = strain
  civil_unrest:
    name: Civil unrest
    moves:
      safety_concern: +0.5
    level_of: state_capacity        # higher = strain
  information_reliability:
    name: Information reliability
    moves:
      media_trust: +0.8
    level_of: knowledge        # higher = build
  news_overload:
    name: News overload
    moves:
      news_attention: +0.5
    level_of: attention        # higher = strain
  migration_flow:
    name: Migration flow
