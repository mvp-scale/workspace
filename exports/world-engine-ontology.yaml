    depends_on: [social_trust, state_capacity, community_ties]
  media_trust:
    name: Trust in news media
    drives:
      health_action: +0.2
      break_rules: -0.5
    depends_on: [knowledge]
  political_efficacy:
    name: Political efficacy
    drives:
      vote: +0.8
      protest: +0.5
    depends_on: [legitimacy]
  grievance:
    name: Felt grievance
    drives:
      share: +0.5
      vote: +0.5
      protest: +0.8
      break_rules: +0.5
    depends_on: [asset_wealth, social_trust, state_capacity, population]
  news_attention:
    name: News attention
    drives:
      share: +0.5
      vote: +0.5
    depends_on: [attention, state_capacity]
  tenure:
    name: Tenure (rent or own)
    drives:
      move: -0.5
  housing_burden:
    name: Housing burden
    drives:
      move: +0.5
      borrow: +0.2
      family_change: -0.5
    depends_on: [housing_stock, monetary_credit]
  life_stage:
    name: Life stage and household
    drives:
      change_work: -0.5
      move: -0.5
      study_train: -0.5
      family_change: +0.2
  education_skills:
    name: Education and skills
    drives:
      study_train: -0.5
      start_business: +0.5
  digital_access:
    name: Digital access
    drives:
      subscribe: +0.5
      claim_support: +0.2
  hazard_exposure:
    name: Local hazard exposure
    drives:
      move: +0.5
      stockpile_prepare: +0.5
  car_dependence:
    name: Car dependence
    drives:
      buy_new: +0.2

decisions:         # decision -> resources it draws on (uses up) or builds
  spend:
    name: Spend (vs save)
    draws_on: [asset_wealth, food_stock]
    builds: [productive_capital]
  buy_new:
    name: Buy something new
    draws_on: [minerals_materials, asset_wealth, primary_energy]
    builds: [productive_capital]
  subscribe:
    name: Subscribe or commit
    draws_on: [asset_wealth, attention]
    builds: [computing_capacity]
  travel:
    name: Travel
    draws_on: [primary_energy, atmosphere_climate, asset_wealth, built_infrastructure]
  change_work:
    name: Change work
    draws_on: [community_ties]
    builds: [skills, labour_force]
  move:
    name: Move home
    draws_on: [housing_stock, asset_wealth, community_ties]
    builds: [population]
  switch_brand:
    name: Switch brand or provider
    draws_on: [attention]
    builds: [knowledge, supply_networks]
  share:
    name: Share or engage publicly
    draws_on: [social_trust]
    builds: [attention, knowledge, legitimacy]
  vote:
    name: Vote or take party action
    draws_on: [attention]
    builds: [legitimacy, state_capacity]
  protest:
    name: Protest or strike
    draws_on: [legitimacy, state_capacity]
    builds: [community_ties, attention]
  health_action:
    name: Take a health action
    draws_on: [care_capacity, asset_wealth]
    builds: [population_health]
  study_train:
    name: Study or retrain
    draws_on: [attention, asset_wealth]
    builds: [skills]
  family_change:
    name: Change family situation
    draws_on: [housing_stock, asset_wealth]
    builds: [population, community_ties]
  stockpile_prepare:
    name: Stockpile or prepare
    draws_on: [food_stock, supply_networks, asset_wealth, water]
  start_business:
    name: Start or expand a business
    draws_on: [asset_wealth, monetary_credit]
    builds: [productive_capital, labour_force]
  donate_volunteer:
    name: "Give, volunteer or join a group"
    draws_on: [asset_wealth]
    builds: [community_ties, social_trust]
  claim_support:
    name: Claim support
    draws_on: [public_finances, state_capacity, attention]
  borrow:
    name: Borrow (take on new debt)
    draws_on: [monetary_credit, asset_wealth]
  invest:
    name: Invest
    builds: [asset_wealth, monetary_credit, productive_capital]
  break_rules:
    name: Ignore official rules or guidance
    draws_on: [legitimacy, state_capacity, social_trust]

