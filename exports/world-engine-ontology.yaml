      spend: +0.2
      buy_new: +0.2
      borrow: +0.2
  conformity:
    name: Social influence susceptibility
    drives:
      share: +0.2
  econ_orientation:
    name: Economic orientation
    drives:
      vote: +0.2
  cultural_orientation:
