conditions:        # condition -> person states it moves; other conditions it pushes; the resource it is a level of
  water_stress:
    name: Water stress
    pushes:
      health_risk: +0.2
    level_of: water        # higher = strain
  land_degradation:
    name: Land degradation
    pushes:
      food_insecurity: +0.2
    level_of: land_soil        # higher = strain
  biodiversity_loss:
    name: Biodiversity loss
    pushes:
      food_insecurity: +0.2
    level_of: biodiversity        # higher = strain
  climate_stress:
    name: Climate stress
    moves:
      safety_concern: +0.2
    level_of: atmosphere_climate        # higher = strain
  air_pollution:
    name: Air pollution
    moves:
      perceived_health_threat: +0.2
    level_of: atmosphere_climate        # higher = strain
  energy_fuel:
    name: Energy cost and supply
    moves:
      price_attention: +0.5
    pushes:
      prices: +0.5
    level_of: primary_energy        # higher = strain
  mineral_scarcity:
    name: Mineral and material scarcity
    pushes:
      supply_chain_strain: +0.5
    level_of: minerals_materials        # higher = strain
  food_insecurity:
    name: Food insecurity
    pushes:
      prices: +0.2
    level_of: food_stock        # higher = strain
  housing_cost:
    name: Housing cost
    moves:
      financial_stress: +0.5
      housing_burden: +0.8
    level_of: housing_stock        # higher = strain
  infrastructure_condition:
    name: Infrastructure condition
    pushes:
      disruption: -0.5
    level_of: built_infrastructure        # higher = build
  disruption:
    name: Disruption of services
    moves:
      time_pressure: +0.5
      wellbeing: -0.2
    level_of: built_infrastructure        # higher = strain
  industrial_output:
    name: Industrial output
    moves:
      job_worry: -0.2
    pushes:
      job_security: +0.5
    level_of: productive_capital        # higher = build
  supply_chain_strain:
    name: Supply chain strain
    pushes:
      prices: +0.5
    level_of: supply_networks        # higher = strain
  tech_adoption:
    name: Technology adoption
    moves:
      job_worry: +0.2
    level_of: computing_capacity        # higher = build
  cyber_insecurity:
    name: Cyber insecurity
    pushes:
      disruption: +0.5
    level_of: computing_capacity        # higher = strain
  prices:
    name: Prices
    moves:
      financial_stress: +0.5
      liquidity: -0.5
      price_attention: +0.5
      optimism: -0.5
    level_of: monetary_credit        # higher = strain
  borrowing_cost:
    name: Borrowing cost and credit access
    moves:
      debt_burden: +0.5
      housing_burden: +0.5
    level_of: monetary_credit        # higher = strain
  asset_values:
    name: Asset values
    moves:
      liquidity: +0.5
      optimism: +0.5
    level_of: asset_wealth        # higher = build
  market_volatility:
    name: Market volatility
    pushes:
      asset_values: -0.5
    level_of: asset_wealth        # higher = strain
  private_debt:
    name: Private debt
    moves:
      debt_burden: +0.8
    level_of: asset_wealth        # higher = strain
  inequality:
    name: Economic inequality
    moves:
      grievance: +0.5
    level_of: asset_wealth        # higher = strain
  fiscal_strain:
    name: Fiscal strain
    pushes:
      public_service_quality: -0.5
    level_of: public_finances        # higher = strain
  health_risk:
    name: Health risk
    moves:
      loneliness: +0.2
      perceived_health_threat: +0.8
    level_of: population_health        # higher = strain
  mental_distress:
    name: Mental distress
    moves:
      wellbeing: -0.8
    level_of: population_health        # higher = strain
  care_strain:
    name: Care strain
    moves:
      time_pressure: +0.5
      perceived_health_threat: +0.2
    level_of: care_capacity        # higher = strain
  job_security:
    name: Job security
    moves:
      financial_stress: -0.5
      liquidity: +0.5
      job_worry: -0.8
      optimism: +0.5
      job_satisfaction: +0.2
    level_of: labour_force        # higher = build
  pay_growth:
    name: Pay growth
    moves:
      financial_stress: -0.5
      liquidity: +0.5
      job_satisfaction: +0.2
    level_of: labour_force        # higher = build
  social_division:
