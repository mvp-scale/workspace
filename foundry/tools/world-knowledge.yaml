reference: world-knowledge
description: >
  An EXPANDER, not a decider. Nothing in this file makes a selection -- every section here only
  activates after a tool has already selected something live (a domain, a gap category), and its
  job is to give more insight into that one thing, not to classify anything itself. The structural
  relationship is always the same shape: a tool's live answer id -> a lookup key into a section
  below -> more content to carry forward (extra state for the next call, a deeper library to
  recurse into). Every section below is now labelled SUPPORTS: <tool>.<variant> stating exactly
  which live call's output it expands on, and by what key -- if a section can't name one, that's a
  real gap in this file, not a missing label. Replaces customer-lens.yaml and
  tools/domain-library.yaml: the domain/audience candidate lists used to classify now live only
  inside slicer.yaml itself (they're literally the `criteria` of a live question -- keeping a
  second copy here just meant two files to keep in sync, which is exactly the kind of duplication
  that made slicer.yaml hard to trust).
status: >
  hand-authored by Claude Sonnet 5, offline -- generic/reusable scaffolding (front-loading), not
  idea-specific content. Same honesty flag as everything else in tools/: an informed guess at
  what's cross-domain-common, not a verified external source. domain_enrichment is new; pain_points
  /delights/customer_journey are unchanged from the retired customer-lens.yaml. gap_categories and
  gap_category_detail were unchanged content from the retired tools/gap-library.yaml and
  tools/gap-library-single-point-of-failure.yaml (still true) -- folded in here for the same
  reason domain-library.yaml and customer-lens.yaml were: a second file holding content that
  belongs to one central place is duplication, not organization. gap_categories.text was later
  rewritten in place (polarity fix, see comment above that section) -- moved-not-modified no
  longer applies to it specifically. foundry/layered_walk.py reads from this file directly
  (slicer_live.py and grinder_live.py, which read from it first, have since been deleted --
  superseded by layered_walk.py per an Opus end-to-end review).
open_question: >
  gap_categories are still checked against every idea unconditionally today (all 21, regardless of
  domain) -- now that by-domain exists, domain_enrichment could narrow which categories even get
  checked (e.g. nonfunctional-data-protection weighted up for a compliance-regulated domain,
  ops-incident-response almost everywhere). Not resolved here; the mechanism still runs the old way
  until that's decided.

# =============================================================================================
# SUPPORTS: layered_walk.py's classify_domain_audience (fanned into the same call as domain/
# audience -- Speculative Fan-Out: ask everything cheap and parallel, not one call per concern).
# Ten generic, reusable probes about the idea's tech/context, asked regardless of which turn out
# to matter. Feeds two things downstream, neither a new live call: (1) Composite Scoring --
# category selection in classify_root becomes 0.7*own-gap-score + 0.3*profile-boost, where a
# category's boost is the sum of every probe that lists it in `boosts`, read below. (2)
# Confidence-Gated Routing with more than one signal -- in `walk`, a boosted branch's bar to keep
# recursing drops slightly; a non-boosted branch's bar rises, so the walk digs deeper where the
# profile actually says it matters and backs off sooner where it doesn't.
# =============================================================================================
profile_probes:
  - id: sensitive-data
    text: This idea involves handling data that would be considered sensitive or private if exposed.
    criteria: {"true": "Yes, sensitive or private data is involved.", "false": "No, nothing particularly sensitive."}
    boosts: [nonfunctional-data-protection, architecture-data-ownership]
  - id: external-integration
    text: This idea needs to send or receive data from a third-party service it doesn't control.
    criteria: {"true": "Yes, a real external dependency exists.", "false": "No, this is self-contained."}
    boosts: [architecture-external-boundary, spec-integration-protocol]
  - id: real-time-latency
    text: This idea has a real-time or low-latency requirement where a slow response meaningfully hurts the outcome.
    criteria: {"true": "Yes, response speed genuinely matters here.", "false": "No, normal response times are fine."}
    boosts: [nonfunctional-performance]
  - id: financial-transaction
    text: This idea involves moving or tracking money.
    criteria: {"true": "Yes, money changes hands or is tracked.", "false": "No money is involved."}
    boosts: [nonfunctional-data-protection]
  - id: regulated-industry
    text: This idea operates in an industry with specific regulatory compliance requirements, such as health, finance, or government.
    criteria: {"true": "Yes, a real regulatory regime applies.", "false": "No specific regulation applies."}
    boosts: [nonfunctional-data-protection]
  - id: multi-tenant
    text: This idea needs to serve multiple separate organizations or customers from the same system, keeping their data apart.
    criteria: {"true": "Yes, real multi-tenancy is needed.", "false": "No, one organization or a single shared group."}
    boosts: [architecture-component-boundaries, architecture-data-ownership]
  - id: offline-capable
    text: This idea needs to keep working when the user has no network connection.
    criteria: {"true": "Yes, offline use is a real requirement.", "false": "No, a network connection can be assumed."}
    boosts: [nonfunctional-availability, functional-error-behavior]
  - id: mobile-required
    text: This idea needs a dedicated mobile app, not just a page that happens to work on a phone.
    criteria: {"true": "Yes, a dedicated mobile app is needed.", "false": "No dedicated mobile app is needed."}
    boosts: [nonfunctional-accessibility, story-first-use]
  - id: high-user-scale
    text: This idea needs to support a large or fast-growing number of concurrent users, not just a small fixed group.
    criteria: {"true": "Yes, real scale is expected.", "false": "No, a small, stable group of users."}
    boosts: [nonfunctional-performance, nonfunctional-availability]
  - id: frequent-change
    text: The underlying process or rule this idea automates changes often enough that the solution needs to be easy to reconfigure, not just built once.
    criteria: {"true": "Yes, this needs to be easy to reconfigure.", "false": "No, this is stable once built."}
    boosts: [functional-data-lifecycle, ops-release-process]

# =============================================================================================
# SUPPORTS: layered_walk.py's Layer 0c (layer0_gaps) -- NOT slicer.yaml's five rewritten variants
# (by-domain/by-layer/by-risk/by-phase/binary-halving). Flagged honestly, not papered over: this
# is a real mismatch, still unresolved. This mechanism predates the variant rewrite and is still
# the only one of the two that actually runs live; the five rewritten variants have only ever had
# by-domain exercised (layered_walk.py's Layer 0a). Structural relationship: none upstream -- this
# IS a first selection a tool makes (idea+customer -> which categories apply), not an expansion of
# one; it runs independently of by-domain's own classification, not narrowed by it (see
# open_question above).
# =============================================================================================
gap_categories: # the 21 generic, reusable, requirement-shaped Level 0 gap categories -- checked
                # live, one noul question each, fanned into one call by layered_walk.py. Shape:
                # functional/non-functional/architectural/user-story/technical-spec/operational
                # (see each entry's `shape` field), matching a real SRS/backlog/arc42 register.
                # RETIRED (user decision, this session): the original 12 generic "is this a gap"
                # audit-checklist categories (capability-gap, behavior-change,
                # escalation-authority, fairness-distribution, visibility-tracking,
                # noise-reduction, knowledge-transfer, compliance-constraint, cost-resource,
                # trust-adoption, single-point-of-failure, measurement-gap) -- including the 4 that
                # already had a hand-built gap_category_detail tree (single-point-of-failure,
                # trust-adoption, cost-resource, behavior-change). Reasoning: 8 of the 12 had no
                # library at all, and 7 of those 8 could never be boosted by any profile_probe
                # (see world-knowledge.yaml git history / BRIDGE.md), so "they never landed in a
                # top-4" wasn't reliable evidence of irrelevance either way -- the decision was made
                # on library-shape grounds instead: one consistent, requirement-shaped library beats
                # a mixed audit-checklist-plus-SRS one, and better matches what the user actually
                # wants (see README.md's "Lessons learned"). All 21 remaining categories have a
                # gap_category_detail entry -- see below.
                # POLARITY: every entry reads as a requirement/solved-state statement (matching
                # gap_category_detail's polarity exactly) -- found broken once by an Opus end-to-end
                # review (breadcrumb concatenation of a problem-polarity Slicer text with a
                # solved-state Grinder text produced literal contradictions); the selection question
                # in layered_walk.py asks "is this NOT yet true" against this text -- true still
                # means "a real gap."
  - id: functional-core-capability
    shape: functional
    lens: technical
    text: The system performs every action its users need in order to complete the task it exists for.
  - id: functional-data-lifecycle
    shape: functional
    lens: technical
    text: The system's handling of each record it holds is defined from creation through deletion.
  - id: functional-access-rules
    shape: functional
    lens: technical
    text: The system allows each user only the actions their role permits.
  - id: functional-error-behavior
    shape: functional
    lens: technical
    text: The system behaves in a defined way when an operation does not succeed.
  - id: nonfunctional-performance
    shape: non-functional
    lens: technical
    text: The system's required speed is stated as a measurable target.
  - id: nonfunctional-availability
    shape: non-functional
    lens: technical
    text: The system's required availability is stated as a measurable target.
  - id: nonfunctional-data-protection
    shape: non-functional
    lens: technical
    text: The protection required for the data the system holds is stated as a verifiable requirement.
  - id: nonfunctional-accessibility
    shape: non-functional
    lens: technical
    text: The interface meets a named accessibility standard.
  - id: architecture-component-boundaries
    shape: architectural
    lens: technical
    text: Each component of the system has one stated responsibility.
  - id: architecture-external-boundary
    shape: architectural
    lens: technical
    text: The architecture defines how the system behaves at each boundary with a service it does not control.
  - id: architecture-data-ownership
    shape: architectural
    lens: technical
    text: Each data store in the system has one component that owns it.
  - id: story-first-use
    shape: user-story
    lens: business
    text: As a new user, I can complete my first real task without anyone helping me.
  - id: story-error-recovery
    shape: user-story
    lens: business
    text: As a user, I can recover from my own mistakes without asking anyone for help.
  - id: story-administration
    shape: user-story
    lens: business
    text: As an administrator, I can manage who uses the system without engineering help.
  - id: spec-api-contract
    shape: technical-spec
    lens: technical
    text: The interface the system exposes is specified operation by operation.
  - id: spec-data-model
    shape: technical-spec
    lens: technical
    text: The data the system stores is specified field by field.
  - id: spec-integration-protocol
    shape: technical-spec
    lens: technical
    text: The wire-level behaviour of each call the system makes to another system is specified.
  - id: ops-observability
    shape: operational
    lens: technical
    text: The running system emits the signals an operator needs to judge its health.
  - id: ops-release-process
    shape: operational
    lens: technical
    text: Putting a new version into production follows a defined, repeatable procedure.
  - id: ops-incident-response
    shape: operational
    lens: technical
    text: A written runbook covers the failures the on-call responder is expected to handle.
  - id: ops-data-recovery
    shape: operational
    lens: technical
    text: Restoring the system's data from backup is a proven procedure.

# =============================================================================================
# SUPPORTS: Grinder.atomic-threshold (layered_walk.py's walk_gap/layer_n_node). This is the
# expander in the purest sense in this file -- it exists only to go deeper on ONE thing
# gap_categories already selected. Structural relationship: gap_categories[id] selected at Layer 0
# -> gap_category_detail[that same id] is the recursion target, keyed by the identical id on both
# sides. All 21 remaining categories have an entry now -- the 4 that used to (single-point-of-
# failure, trust-adoption, cost-resource, behavior-change) were retired along with the 8 that
# never had one (see gap_categories' RETIRED comment above); no more "SELECTED, BUT NOTHING BUILT
# YET" categories should appear in report.py's output.
# =============================================================================================
gap_category_detail: # nested sub-libraries under specific gap_categories entries, for
                      # layered_walk.py's recursive walk. All 21 remaining gap_categories have one.
                      # All 21 trees are flat (depth 1) -- unlike the retired single-point-of-
                      # failure tree, which had real depth-2 nesting -- so every leaf that doesn't
                      # clear the atomic threshold stops at "needs further splitting, no deeper
                      # library" rather than recursing again. Same generic, reusable, no-"or"/"and"
                      # discipline throughout (see README.md's "Lessons learned" on why compound
                      # leaves silently break the atomic check).
  functional-core-capability:
    tree:
    - id: func-action-inventory
      text: The requirements name every action a user can perform in the system.
      children: []
    - id: func-outcome-per-action
      text: Each user action produces one defined outcome in the system.
      children: []
    - id: func-precondition-per-action
      text: Each user action has a stated precondition the system enforces before allowing it.
      children: []
    - id: func-success-confirmation
      text: The system returns a confirmation to the user when an action succeeds.
      children: []
    - id: func-scope-exclusions
      text: The requirements name the actions the system deliberately does not perform.
      children: []
  functional-data-lifecycle:
    tree:
    - id: func-record-creation-path
      text: The way each record first enters the system is defined.
      children: []
    - id: func-record-mutable-fields
      text: The fields of an existing record that a user may change are defined.
      children: []
    - id: func-record-deletion-effect
      text: What becomes of a record once a user deletes it is defined.
      children: []
    - id: func-record-retention-period
      text: Each record type has a defined period after which the system removes it.
      children: []
    - id: func-record-change-history
      text: The system keeps the previous value of a record after a user changes it.
      children: []
  functional-access-rules:
    tree:
    - id: func-role-inventory
      text: The requirements name every user role the system recognises.
      children: []
    - id: func-role-permission-list
      text: Each role has a defined list of the actions it may perform.
      children: []
    - id: func-default-permissions
      text: A newly created account receives a defined set of permissions.
      children: []
    - id: func-denied-action-response
      text: The system returns a defined response when a user attempts an action their role forbids.
      children: []
  functional-error-behavior:
    tree:
    - id: func-invalid-input-response
      text: The system returns a defined response when submitted input fails validation.
      children: []
    - id: func-failure-reason-shown
      text: The system shows the user the reason an operation failed.
      children: []
    - id: func-partial-failure-state
      text: The system leaves stored data in a defined state when an operation fails partway through.
      children: []
    - id: func-retry-permission
      text: Whether a user may retry a failed operation is defined for each operation.
      children: []
  nonfunctional-performance:
    tree:
    - id: nfr-latency-target
      text: The maximum acceptable response time for a user-facing request is stated as a number.
      children: []
    - id: nfr-throughput-target
      text: The number of requests the system must handle per unit of time is stated as a number.
      children: []
    - id: nfr-concurrency-target
      text: The number of users the system must serve at the same time is stated as a number.
      children: []
    - id: nfr-latency-measurement-point
      text: The point in the request path at which the response time target is measured is named.
      children: []
  nonfunctional-availability:
    tree:
    - id: nfr-uptime-target
      text: The required uptime is stated as a percentage over a named period.
      children: []
    - id: nfr-recovery-time-target
      text: The maximum time allowed to restore service after an outage is stated as a number.
      children: []
    - id: nfr-data-loss-window
      text: The largest period of data the business accepts losing in an outage is stated as a number.
      children: []
    - id: nfr-maintenance-window
      text: The maintenance window during which the uptime target does not apply is stated.
      children: []
  nonfunctional-data-protection:
    tree:
    - id: nfr-data-classification
      text: Each stored field is assigned a defined sensitivity level.
      children: []
    - id: nfr-encryption-standard
      text: The encryption required for stored data is named.
      children: []
    - id: nfr-authentication-strength
      text: The authentication strength required before a user reaches protected data is stated.
      children: []
    - id: nfr-access-audit-record
      text: Every access to data at the highest sensitivity level produces an audit record.
      children: []
  nonfunctional-accessibility:
    tree:
    - id: nfr-accessibility-standard-version
      text: The version of the accessibility standard the interface must meet is named.
      children: []
    - id: nfr-keyboard-operable
      text: Every interactive control is operable using the keyboard alone.
      children: []
    - id: nfr-text-contrast-ratio
      text: The minimum contrast ratio for text is stated as a number.
      children: []
    - id: nfr-screen-reader-target
      text: The screen reader the interface is required to work with is named.
      children: []
  architecture-component-boundaries:
    tree:
    - id: arch-component-inventory
      text: The components the system is built from are listed in one place.
      children: []
    - id: arch-component-interface
      text: The interface through which each component is called is named.
      children: []
    - id: arch-allowed-callers
      text: The components each component is allowed to call are named.
      children: []
    - id: arch-deployment-unit
      text: Each component is assigned to a named deployment unit.
      children: []
  architecture-external-boundary:
    tree:
    - id: arch-dependency-inventory
      text: Every external service the system calls is listed in the architecture.
      children: []
    - id: arch-dependency-isolation
      text: Each external service is reached through a single component that isolates it from the rest of the system.
      children: []
    - id: arch-dependency-failure-behavior
      text: How the system behaves while a named external service is unreachable is defined.
      children: []
    - id: arch-dependency-data-boundary
      text: The data the system sends to each external service is listed.
      children: []
  architecture-data-ownership:
    tree:
    - id: arch-write-path-single
      text: Writes to each data store pass through its owning component.
      children: []
    - id: arch-read-path-defined
      text: The path by which a component reads data owned by another component is defined.
      children: []
    - id: arch-store-technology-named
      text: The storage technology holding each data set is named.
      children: []
    - id: arch-schema-source-of-truth
      text: The place where each data store's schema is defined is recorded.
      children: []
  story-first-use:
    tree:
    - id: story-self-serve-signup
      text: As a new user, I can create my account without contacting anyone.
      children: []
    - id: story-value-in-first-session
      text: As a new user, I see a useful result in my first session.
      children: []
    - id: story-try-before-committing
      text: As a new user, I can try the system on example data before entering my own.
      children: []
    - id: story-resume-setup
      text: As a new user, I can stop partway through setup and resume where I left off.
      children: []
  story-error-recovery:
    tree:
    - id: story-undo-last-action
      text: As a user, I can undo the action I just took.
      children: []
    - id: story-correct-after-submit
      text: As a user, I can correct an entry after I have submitted it.
      children: []
    - id: story-see-what-changed
      text: As a user, I can see what changed after I correct an entry.
      children: []
    - id: story-keep-partial-input
      text: As a user, I can return to a partly filled form without retyping what I already entered.
      children: []
  story-administration:
    tree:
    - id: story-admin-add-user
      text: As an administrator, I can add a new user myself.
      children: []
    - id: story-admin-revoke-access
      text: As an administrator, I can remove a person's access immediately.
      children: []
    - id: story-admin-change-role
      text: As an administrator, I can change a user's role without re-entering their details.
      children: []
    - id: story-admin-review-activity
      text: As an administrator, I can see what a given user did in the system.
      children: []
  spec-api-contract:
    tree:
    - id: spec-operation-inventory
      text: Every operation the interface exposes is listed by name.
      children: []
    - id: spec-request-field-types
      text: Each request field has a specified data type.
      children: []
    - id: spec-required-field-marking
      text: Each request field states whether it is mandatory.
      children: []
    - id: spec-response-shape
      text: The fields returned in a successful response are specified.
      children: []
    - id: spec-error-code-per-failure
      text: Each failure the interface can return has a specified error code.
      children: []
  spec-data-model:
    tree:
    - id: spec-entity-inventory
      text: Every entity the system stores is named.
      children: []
    - id: spec-field-type
      text: Each stored field has a specified data type.
      children: []
    - id: spec-entity-identifier
      text: Each entity has a specified unique identifier.
      children: []
    - id: spec-relationship-cardinality
      text: The cardinality of each relationship between entities is specified.
      children: []
    - id: spec-field-value-range
      text: The accepted range of values is specified for each constrained field.
      children: []
  spec-integration-protocol:
    tree:
    - id: spec-auth-scheme
      text: The authentication scheme each outbound call uses is named.
      children: []
    - id: spec-call-timeout
      text: The timeout for each outbound call is specified as a number.
      children: []
    - id: spec-retry-count
      text: The number of retries for a failed outbound call is specified as a number.
      children: []
    - id: spec-idempotency-key
      text: The field that makes a repeated request safe to resend is specified.
      children: []
    - id: spec-rate-limit
      text: The rate limit each outbound call must stay within is stated as a number.
      children: []
  ops-observability:
    tree:
    - id: ops-health-check-endpoint
      text: The service exposes a health check that reports whether it can serve traffic.
      children: []
    - id: ops-failure-rate-metric
      text: The system emits a metric for the rate of failed requests.
      children: []
    - id: ops-log-correlation-id
      text: Each log line carries the identifier of the request that produced it.
      children: []
    - id: ops-alert-threshold
      text: The metric value at which an operator is alerted is defined.
      children: []
  ops-release-process:
    tree:
    - id: ops-single-command-deploy
      text: One documented command deploys the current build to production.
      children: []
    - id: ops-rollback-procedure
      text: The procedure for returning to the previous version is written down.
      children: []
    - id: ops-release-verification
      text: The check that confirms a release is serving correctly is defined.
      children: []
    - id: ops-change-record
      text: Each production change is recorded against the person who made it.
      children: []
    - id: ops-migration-ordering
      text: The order in which a schema change is applied relative to the code change is defined.
      children: []
  ops-incident-response:
    tree:
    - id: ops-expected-failure-list
      text: The failures a responder is expected to handle are listed.
      children: []
    - id: ops-first-response-steps
      text: Each listed failure has written first-response steps.
      children: []
    - id: ops-escalation-contact
      text: The person to escalate to is named for each listed failure.
      children: []
    - id: ops-runbook-rehearsed
      text: The runbook has been followed at least once outside a real incident.
      children: []
  ops-data-recovery:
    tree:
    - id: ops-backup-interval
      text: The interval at which data is backed up is defined.
      children: []
    - id: ops-restore-steps
      text: The steps to restore data from a backup are written down.
      children: []
    - id: ops-restore-rehearsed
      text: A restore from backup has been completed successfully at least once.
      children: []
    - id: ops-backup-isolation
      text: Backups are stored separately from the system they protect.
      children: []

# =============================================================================================
# SUPPORTS: Slicer.by-domain (slicer.yaml). Structural relationship: by-domain's live `choice`
# call returns a `domain` answer id (one of the 10 ids that are slicer.yaml's own inline
# criteria) -> that id is the lookup key here -> returns likely_pain_points/likely_delights/
# riskiest_journey_stage. This is the clean case: a tool's answer id is literally the key into
# this section, nothing inferred or renamed in between.
# =============================================================================================
domain_enrichment_notes: >
  Keyed by slicer.yaml's by-domain domain ids. For each domain: which of the pain_points/delights
  below are especially likely to matter, and which customer_journey stage tends to carry the most
  risk. Kept to 2-3 each per domain on purpose -- this is enrichment to carry forward into further
  decomposition (e.g. as extra context in a Grinder node's state), not a second classification
  pass, and "understand the size" applies here the same way it applies to choice option counts:
  more isn't better if it dilutes what actually gets used.

domain_enrichment: # the actual data -- was accidentally folded into the note above as one long
                    # string (a real bug: `domain_enrichment: >` swallowed this whole mapping into
                    # a scalar, making it unparseable as data); split apart and verified below.
  internal-ops-tooling:
    likely_pain_points: [time-cost, visibility, inconsistency]
    likely_delights: [instant-confirmation, checkable-history]
    riskiest_journey_stage: onboarding
  customer-facing-saas:
    likely_pain_points: [trust-in-accuracy, onboarding-friction, support-unreachable]
    likely_delights: [minutes-to-useful, human-escalation]
    riskiest_journey_stage: first-real-use
  marketplace-two-sided:
    likely_pain_points: [fairness-doubt, trust-in-accuracy, inconsistency]
    likely_delights: [instant-confirmation, checkable-history]
    riskiest_journey_stage: evaluating-trust
  consumer-hardware-iot:
    likely_pain_points: [learning-curve, unreliable, integration-friction]
    likely_delights: [works-on-what-i-have, warned-before-not-after]
    riskiest_journey_stage: onboarding
  health-wellness:
    likely_pain_points: [privacy-doubt, trust-in-accuracy, cant-prove-value]
    likely_delights: [remembers-me, human-escalation]
    riskiest_journey_stage: ongoing-use
  developer-tooling:
    likely_pain_points: [learning-curve, integration-friction, lock-in-fear]
