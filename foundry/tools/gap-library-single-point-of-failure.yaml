reference: gap-library-single-point-of-failure
description: >
  Nested sub-library under the Level 0 "single-point-of-failure" category in gap-library.yaml.
  Generic and reusable -- applies to any idea where a single point of failure was flagged, not
  idea-specific. Two levels deep; grinder_live.py runs a live atomic check at every node before
  deciding whether to recurse into its children.
status: >
  hand-authored by Claude Sonnet 5, offline -- generic/reusable content (front-loading), not
  idea-specific pieces. Same honesty note as tools/gap-library.yaml.
tree:
  - id: backup-exists
    text: A designated backup person or mechanism already exists for when the primary is unavailable.
    children: []
  - id: backup-activation-defined
    text: There's a clear, defined trigger or process for switching to the backup, not just an assumption it would happen.
    children:
      - id: trigger-condition-specified
        text: The specific condition that triggers switching to the backup -- such as time elapsed or an explicit request -- is clearly specified, not left to judgment.
        children: []
      - id: activation-mechanism-exists
        text: A concrete mechanism -- a tool, a process, or a script -- actually performs the switch to backup, not just a verbal agreement.
        children: []
      - id: activation-authority-clear
        text: It's clear who has the authority to trigger the switch to the backup.
        children: []
  - id: failure-detection
    text: There's a reliable way to detect that the primary has actually become unavailable, rather than relying on someone noticing.
    children:
      - id: detection-mechanism-exists
        text: A specific mechanism exists that detects the primary's unavailability, rather than depending on manual observation.
        children: []
      - id: detection-latency-acceptable
        text: The time between the primary actually becoming unavailable and that being detected is short enough not to matter.
        children: []
  - id: backup-capability-verified
    text: The backup has been confirmed capable of actually doing what's needed, not just nominally assigned.
    children:
      - id: backup-trained
        text: The backup has actually been trained or briefed on what they'd need to do, not just listed as backup.
        children: []
      - id: backup-tested
        text: The backup role has actually been tested or exercised at least once, not just assumed to work if needed.
        children: []
