tool: conveyor
description: >
  Takes Sorter's groups, sequences them, and estimates how long each takes -- the timing job
  nothing had before. Operates on groups now, not individual pieces (dependency-order is the
  survivor of the original tool, which topologically sorted raw pieces -- that behavior survives
  applied one level up).
status: >
  dependency-order and parallel-lanes need depends_on, which is still empty for every problem in
  this repo (dependency inference isn't built -- an honest gap, not a silent one). risk-first is
  buildable today straight from Sorter's by-risk-tier groups, no dependency data needed.
  duration-weighted and critical-path need a real time estimate per group, which nothing in this
  repo can honestly supply yet -- named per the five-tool cap, not populated. Do not fake a number
  into either until a real source exists (reference-class industry norms, per the Monte Carlo
  discussion in README.md) -- an invented duration is exactly the fabricated-precision mistake this
  project has already caught itself making once. A live score call asking a model to guess
  duration in real time units would be the same mistake again, not a fix: these models can judge
  text against a claim, not estimate wall-clock time they have no grounding in.
patterns_applied: >
  Checked against all four documented patterns. Conveyor has no live call of its own today and
  none of the four patterns change that: dependency-order/parallel-lanes are blocked on data
  (depends_on), not on mechanism; duration-weighted/critical-path are blocked on there being
  nothing honest for a classifier -- confidence-gated or not -- to estimate. risk-first is a
  straight read of Sorter's output, same reasoning as Spotlight.
variants:
  - id: dependency-order
    rule: >
      Topological sort of groups by their pieces' combined depends_on. Blocked today -- see status.
    tradeoff: correct only as far as depends_on itself is correct, and flattens branching
      structure into one line.

  - id: risk-first
    rule: >
      Ignore dependency; sequence groups by mean risk-if-false, highest first -- reads directly
      off Sorter's by-risk-tier groups, no dependency data needed.
    tradeoff: useful for "what to de-risk first," useless as an actual build order if dependencies
      are real (you can't build the risky part before its prerequisite just because it's scarier).

  - id: parallel-lanes
    rule: >
      Identify which groups have no dependency on each other at all and output them as separate
      lanes instead of forcing one line. Blocked today -- see status.
    tradeoff: most honest about real structure, but needs a display that can show multiple lanes --
      Conveyor's current single-line "A -> B -> C" trace output can't yet.

  - id: duration-weighted
    rule: NOT POPULATED. Would order + estimate rough time per group from a real duration source.
    tradeoff: n/a until that source exists.

  - id: critical-path
    rule: >
      NOT POPULATED. Would reuse lab_decompose.py's real cpm() forward/backward pass -- proven
      code, already fixed one real bug -- but needs the same duration source as duration-weighted
      to have anything to compute over.
    tradeoff: n/a until that source exists.
