tool: spotlight
description: >
  Ranks what most needs answering -- deliberately distinct from Conveyor's "how long," this is
  "how sure are we." Kept as its own tool rather than folded into Conveyor for exactly that reason:
  merging "when" and "how confident" into one number would hide one behind the other.
status: risk-plus-disagreement is live today (funnel.py's spotlight()). The other four are the
  same computation over the same inputs (per-piece/per-group risk and cross-model disagreement,
  both already produced by Sorter) with a different sort key -- no new live call needed for any of
  the five, consistent with "minimal agentic, mostly scaffolding."
patterns_applied: >
  Checked against all four documented patterns. None of Spotlight's five variants need a new live
  call or a mechanism change -- they're pure recombination of numbers Sorter already produced, and
  none of the four patterns are about how to recombine, only how to call and route. The one real
  change flows down from Sorter's own fix: once bounce_and_weigh reads `weigh`'s `confidence`
  field (see sorter.yaml), risk-plus-disagreement's "disagreement" term should fold in low
  confidence the same way it folds in cross-model spread -- both are "don't trust this score at
  face value" signals, and today only the second is counted.
variants:
  - id: risk-plus-disagreement
    rule: Sort by (mean risk-if-false + cross-model disagreement on supported-p), descending.
      Today's default.
    tradeoff: proven across 5 problems / 25 claims; conflates two different reasons something might
      need attention (it's dangerous vs. models can't agree on it) into one number.

  - id: disagreement-only
    rule: Sort by cross-model disagreement alone, ignoring risk.
    tradeoff: purely "where do the models disagree" -- useful for the cross-model-family research
      question (does decomposition hold up across Jev-like models generally), useless for
      prioritizing what actually matters to the idea.

  - id: risk-only
    rule: Sort by mean risk-if-false alone, ignoring disagreement.
    tradeoff: purely "what hurts most if wrong" -- the models could unanimously agree and still all
      be wrong; this variant would never surface that.

  - id: downstream-impact
    rule: >
      Sort by how many other pieces/groups depend on this one (blast radius in the dependency
      graph), ignoring risk and disagreement entirely. Blocked today -- depends_on is still empty
      for every problem in this repo.
    tradeoff: structural, not judgment-based -- doesn't need live scores at all, only Slicer's
      depends_on edges. Would be the cheapest of the five once dependency inference exists, but a
      heavily-depended-on piece isn't necessarily risky, just central.

  - id: audience-weighted
    rule: >
      Sort by risk-plus-disagreement, but multiply by a fixed weight for whichever audience
      by-domain classified as this idea's primary one (replaces persona-weighted -- audience is
      now a classified id, criteria defined inline in slicer.yaml's by-domain variant, not a
      freely-invented persona).
    tradeoff: only available when by-domain actually ran and classified an audience; otherwise
      falls back to risk-plus-disagreement.
