reference: gap-library
description: >
  The front-loaded candidate library a live Slicer selects from. Twelve generic problem-structure
  gaps, none of them idea-specific -- the same twelve apply whether the idea is an on-call
  rotation, a shift-swap app, or a recycling bin. For a given idea, each category gets one live
  noul question, in context (idea + customer as state); the categories that clear the confidence
  bar become the actual decomposition -- selected by the tools, not authored by Claude. This is
  what makes a live Slicer possible without a generative LLM call: classification over a fixed
  library, not generation.
status: >
  hand-authored by Claude Sonnet 5, offline -- but generic/reusable across every idea, not
  idea-specific content. That distinction is the whole point -- this library existing is fine
  (front-loading), writing idea-specific pieces from it by hand is not (see README.md's "you
  can't predefine the pieces" correction).
categories:
  - id: capability-gap
    lens: technical
    text: A needed technical capability or tool does not clearly already exist and would need to be built or obtained.
  - id: behavior-change
    lens: business
    text: Solving this requires people to change an existing habit or behavior, not just get a new tool.
  - id: escalation-authority
    lens: business
    text: Solving this requires a clear decision-making or escalation path that doesn't already exist.
  - id: fairness-distribution
    lens: business
    text: Solving this requires something to be distributed or shared fairly across multiple people, not concentrated on one or a few.
  - id: visibility-tracking
    lens: technical
    text: Solving this requires someone to be able to see or track status that isn't currently visible.
  - id: noise-reduction
    lens: technical
    text: Solving this requires reducing existing noise, false alarms, or low-value work, not just adding new capability.
  - id: knowledge-transfer
    lens: technical
    text: Solving this requires documenting or transferring knowledge that currently exists only in specific people's heads.
  - id: compliance-constraint
    lens: business
    text: Solving this is constrained by a policy, legal, or contractual rule that must not be violated.
  - id: cost-resource
    lens: business
    text: Solving this depends on having enough budget, headcount, or resource, not just the right design.
  - id: trust-adoption
    lens: business
    text: Solving this depends on people trusting a new mechanism enough to actually rely on it, not just it existing.
  - id: single-point-of-failure
    lens: technical
    text: The current situation depends on one person or thing with no backup, creating a single point of failure.
  - id: measurement-gap
    lens: technical
    text: It's currently unclear how to measure whether this problem is actually getting better or worse.
