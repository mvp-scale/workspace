[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevgw"
version = "0.3.4"
description = "One decision model at a time behind one TypeSafe-compatible /v1/systemone endpoint, with a control panel and an optional tunnel."
requires-python = ">=3.10"
dependencies = []  # standard library only (Pillow and ffmpeg are used by the built-in image and video samples, both on Colab)

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["jevgw/data/vendor", "work", "dist", "build", "*.ipynb"]  # the vendored code is copied from other repos; the notebook is generated by build_notebook.py

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; a few long string literals are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.setuptools.packages.find]
include = ["jevgw*"]

[tool.setuptools.package-data]
jevgw = ["ui/*.html", "data/*", "data/vendor/**/*"]
